<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>温泉村物語 奉行所エディタ</title>
<style>
  :root {
    --bg: #14181b; --surface: #1c2226; --card-bg: #2f3540; --card-border: #5d4d35;
    --gold: #d7b66f; --title: #f3e7c6; --body: #ece8dc; --caption: #b6b0a2;
    --success: #6ea95b; --danger: #c95d54; --info: #7b93b9;
    --tier1: #7db3d8; --tier2: #d98c5f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--body); font-family: "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.5; }
  header { position: sticky; top: 0; z-index: 20; background: linear-gradient(180deg, #1c2226 0%, #171b1e 100%); border-bottom: 1px solid var(--card-border); padding: 10px 16px; }
  .header-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 1.05rem; color: var(--title); margin: 0; white-space: nowrap; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  input[type="search"] { background: var(--surface); border: 1px solid var(--card-border); color: var(--body); border-radius: 8px; padding: 7px 10px; font-size: 0.85rem; width: 180px; }
  button { background: #7b5d36; color: var(--title); border: 1px solid var(--card-border); border-radius: 8px; padding: 7px 12px; font-size: 0.8rem; cursor: pointer; transition: filter 0.1s; -webkit-tap-highlight-color: transparent; }
  button:hover { filter: brightness(1.15); }
  button.danger { background: #5a2e28; }
  button.ghost { background: transparent; }
  button.small { padding: 5px 9px; font-size: 0.74rem; }
  #editCount { color: var(--gold); font-weight: bold; font-size: 0.82rem; white-space: nowrap; }
  nav#sectionTabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 0; }
  .sec-tab { flex-shrink: 0; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--card-border); border-bottom: none; border-radius: 10px 10px 0 0; padding: 7px 14px; cursor: pointer; color: var(--caption); font-size: 0.85rem; }
  .sec-tab.active { background: var(--card-bg); color: var(--title); border-color: var(--gold); }
  .sec-tab .tab-edit-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); display: none; margin-left: 2px; }
  .sec-tab.has-edits .tab-edit-dot { display: inline-block; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 10px 60px; }
  .empty-hint { color: var(--caption); font-size: 0.85rem; text-align: center; padding: 40px 10px; }

  .settings-grid { display: flex; flex-direction: column; gap: 8px; }
  .setting-row { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
  .setting-row.edited { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .setting-label { flex: 1; min-width: 0; }
  .setting-name { font-size: 0.82rem; font-weight: bold; color: var(--title); }
  .setting-desc { font-size: 0.72rem; color: var(--caption); margin-top: 2px; }
  .setting-input { width: 90px; flex-shrink: 0; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 6px; color: var(--body); font-size: 0.85rem; padding: 6px 8px; text-align: right; }
  .setting-input:focus { outline: none; border-color: var(--gold); }

  .quest-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
  .quest-card.tier1 { border-left: 3px solid var(--tier1); }
  .quest-card.tier2 { border-left: 3px solid var(--tier2); }
  .quest-card.edited { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .quest-card.deleted { opacity: 0.5; }
  .quest-card summary { list-style: none; cursor: pointer; padding: 9px 10px; display: flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
  .quest-card summary::-webkit-details-marker { display: none; }
  .quest-emoji-badge { font-size: 1.1rem; flex-shrink: 0; }
  .quest-title-preview { flex: 1; min-width: 0; font-size: 0.86rem; font-weight: bold; color: var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quest-meta-badge { font-size: 0.66rem; color: var(--info); flex-shrink: 0; white-space: nowrap; }
  .quest-id-badge { font-size: 0.62rem; color: var(--caption); flex-shrink: 0; font-family: monospace; }
  .quest-edit-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex-shrink: 0; display: none; }
  .quest-card.edited .quest-edit-dot { display: inline-block; }
  .quest-chevron { flex-shrink: 0; color: var(--caption); font-size: 0.65rem; transition: transform 0.15s; }
  .quest-card[open] .quest-chevron { transform: rotate(90deg); }

  .quest-body { padding: 4px 10px 12px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 8px; }
  .field-row { display: flex; flex-direction: column; gap: 3px; }
  .field-row label { font-size: 0.68rem; color: var(--caption); }
  .field-row input[type="text"], .field-row input[type="number"], .field-row textarea, .field-row select {
    width: 100%; background: rgba(0,0,0,0.18); border: 1px solid var(--card-border); border-radius: 6px; color: var(--body);
    font-size: 0.82rem; padding: 6px 8px; font-family: inherit;
  }
  .field-row input:focus, .field-row textarea:focus, .field-row select:focus { outline: none; border-color: var(--gold); background: rgba(0,0,0,0.28); }
  .field-row textarea { min-height: 58px; resize: vertical; }
  .field-pair { display: flex; gap: 8px; }
  .field-pair .field-row { flex: 1; min-width: 0; }
  .field-row.checkbox-row { flex-direction: row; align-items: center; gap: 6px; }
  .field-row.checkbox-row input { width: 16px; height: 16px; flex-shrink: 0; }
  .field-row.checkbox-row label { font-size: 0.78rem; color: var(--body); }
  .reward-hint { font-size: 0.68rem; color: var(--caption); }
  .mats-level-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mats-cell { display: inline-flex; align-items: center; gap: 3px; }
  .mats-cell img { width: 20px; height: 20px; object-fit: contain; }
  .mats-cell input { width: 46px; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 6px; color: var(--body); font-size: 0.85rem; padding: 6px 4px; text-align: right; }
  .mats-cell input:focus { outline: none; border-color: var(--gold); }
  .quest-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .quest-actions-left { display: flex; gap: 8px; }
  .del-btn { font-size: 0.68rem; padding: 4px 8px; background: transparent; border-color: var(--danger); color: var(--danger); }
  .undo-del-btn { font-size: 0.68rem; padding: 4px 8px; background: transparent; border-color: var(--success); color: var(--success); }
  .reset-btn { font-size: 0.68rem; padding: 4px 8px; background: transparent; border-color: var(--card-border); color: var(--caption); display: none; }
  .quest-card.edited .reset-btn { display: inline-block; }
  .add-quest-btn { width: 100%; background: transparent; border: 1px dashed var(--card-border); color: var(--caption); padding: 10px; border-radius: var(--radius); font-size: 0.82rem; margin-top: 4px; }
  .add-quest-btn:hover { border-color: var(--gold); color: var(--gold); }

  #exportModal, #checkpointModal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  #exportModal.open, #checkpointModal.open { display: flex; }
  .export-panel { background: var(--surface); border: 1px solid var(--gold); border-radius: var(--radius); padding: 16px; max-width: 640px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .export-panel h2 { margin: 0; font-size: 1rem; color: var(--title); }
  .export-panel p.hint { margin: 0; font-size: 0.75rem; color: var(--caption); }
  .export-panel textarea { width: 100%; flex: 1; min-height: 160px; background: #0f1214; color: var(--body); border: 1px solid var(--card-border); border-radius: 8px; font-family: monospace; font-size: 0.75rem; padding: 8px; }
  .export-diff-list { max-height: 180px; overflow-y: auto; font-size: 0.78rem; background: #0f1214; border-radius: 8px; padding: 8px 10px; border: 1px solid var(--card-border); }
  .export-diff-list .diff-item { margin-bottom: 8px; }
  .export-diff-list .diff-title { color: var(--gold); font-weight: bold; }
  .export-diff-list .diff-field { color: var(--caption); }
  .export-diff-list del { color: var(--danger); text-decoration: line-through; opacity: 0.7; }
  .export-diff-list ins { color: var(--success); text-decoration: none; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

  /* クエストダンジョン(ルート)タブ: 区間エディタ */
  .seg-row { background: rgba(0,0,0,0.18); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px; margin-bottom: 6px; }
  .seg-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .seg-from { font-size: 0.78rem; color: var(--body); display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .seg-from-input { width: 52px; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 6px; color: var(--body); font-size: 0.85rem; padding: 6px 4px; text-align: right; }
  .seg-from-input:focus { outline: none; border-color: var(--gold); }
  .seg-bg-select { flex: 1; min-width: 110px; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 6px; color: var(--body); font-size: 0.8rem; padding: 6px; }
  .seg-del { background: transparent; border-color: var(--danger); color: var(--danger); flex-shrink: 0; padding: 5px 9px; font-size: 0.74rem; }
  .seg-enemies { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; align-items: center; }
  .enemy-chip { background: #3a4450; border: 1px solid var(--card-border); border-radius: 999px; padding: 4px 9px; font-size: 0.74rem; color: var(--body); }
  .enemy-add-select { background: rgba(0,0,0,0.2); border: 1px dashed var(--card-border); border-radius: 999px; color: var(--caption); font-size: 0.74rem; padding: 4px 6px; max-width: 210px; }
  .seg-empty { font-size: 0.74rem; color: var(--caption); padding: 4px 0; }
  .add-seg-btn { background: transparent; border: 1px dashed var(--card-border); color: var(--caption); padding: 7px; border-radius: 8px; font-size: 0.78rem; margin-top: 4px; }
  .add-seg-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* 背景セット(預かり所)タブ */
  .bgset-new-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .bgset-new-row input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--card-border); color: var(--body); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; }
  .bgset-new-row input:focus { outline: none; border-color: var(--gold); }
  .bgset-phase-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .bgset-phase-row:last-child { border-bottom: none; }
  .bgset-phase-label { flex: 0 0 34px; font-size: 0.8rem; color: var(--title); }
  .bgset-thumb { width: 56px; height: 36px; object-fit: cover; border-radius: 4px; border: 1px solid var(--card-border); flex-shrink: 0; }
  .bgset-status { flex: 1; font-size: 0.72rem; color: var(--caption); min-width: 0; }
  .bgset-file-btn { flex-shrink: 0; background: #7b5d36; color: var(--title); border: 1px solid var(--card-border); border-radius: 8px; padding: 6px 10px; font-size: 0.76rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <h1>🏯 温泉村物語 奉行所エディタ</h1>
    <div class="toolbar">
      <input type="search" id="searchBox" placeholder="依頼名・依頼者・本文で検索...">
      <span id="editCount">編集: 0件</span>
      <button id="checkpointBtn">💾 一時保存</button>
      <button id="exportBtn">📋 エクスポート</button>
      <button id="resetAllBtn" class="danger ghost">全て元に戻す</button>
    </div>
  </div>
  <nav id="sectionTabs"></nav>
</header>
<main id="mainArea"></main>

<div id="exportModal">
  <div class="export-panel">
    <h2>編集内容のエクスポート</h2>
    <p class="hint">変更点だけをJSONにまとめています。この画面のJSONをそのままClaudeに貼り付けてください。</p>
    <div id="exportDiffList" class="export-diff-list"></div>
    <textarea id="exportJson" readonly></textarea>
    <div class="modal-actions">
      <button id="copyJsonBtn">JSONをコピー</button>
      <button id="closeExportBtn" class="ghost">閉じる</button>
    </div>
  </div>
</div>

<div id="checkpointModal">
  <div class="export-panel">
    <h2>一時保存(チェックポイント)</h2>
    <p class="hint">編集途中の状態をこの下のJSONとして保存できます。コピーしてメモアプリ等に控えておき、次回このページを開いた時に貼り付けて「読み込む」を押すと編集を再開できます(このページ単体にはサーバー保存機能がありません)。</p>
    <textarea id="checkpointJson" readonly></textarea>
    <p class="hint">↓ 読み込む場合はここに貼り付け</p>
    <textarea id="checkpointImportInput" placeholder="ここに一時保存JSONを貼り付け"></textarea>
    <div id="checkpointImportStatus" style="font-size:0.78rem; min-height:1.2em; color:var(--caption);"></div>
    <div class="modal-actions">
      <button id="copyCheckpointBtn">JSONをコピー</button>
      <button id="loadCheckpointBtn">読み込む</button>
      <button id="closeCheckpointBtn" class="ghost">閉じる</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
// ゲーム本体のdata.jsを直接読み込んでベースラインを組み立てる(直結化 2026-07-30)。
// 以前はここに全依頼データのコピーがベタ書きされており、data.js反映のたびに手動同期が必要だった。
const QUEST_DATA = {
  quests: QUEST_DEFS,
  rescue: RESCUE_QUEST_DEF,
  routes: QUEST_ROUTE_DEFS,
  constants: {
    QUEST_BOARD_SIZE, QUEST_BOARD_SECOND_SLOT_CHANCE, QUEST_BOARD_THIRD_SLOT_CHANCE,
    QUEST_COOLDOWN_DAYS, QUEST_DEADLINE_DAYS, QUEST_CONTRACT_FEE_DIVISOR,
    QUEST_GOLD_PER_FLOOR, QUEST_REWARD_MULT, QUEST_REWARD_XP,
    RESCUE_QUEST_GOLD_THRESHOLD, RESCUE_QUEST_MAX_ACTIVE_MEMBERS,
    CHASE_ENCOUNTER_CHANCE, BOSS_FLEE_HP_RATIO, BOSS_PURSUIT_ENCOUNTER_CHANCE,
  },
};

// 全体設定の項目定義(name/desc/型)。isPct: 0〜1の割合値として%表示で編集させる
const CONST_DEFS = [
  { key: "QUEST_BOARD_SIZE", name: "張り出し枚数の上限", desc: "1日に張り出される依頼の最大枚数(1件目は確定)" },
  { key: "QUEST_BOARD_SECOND_SLOT_CHANCE", name: "2件目が出る確率", desc: "0〜1の割合", isPct: true },
  { key: "QUEST_BOARD_THIRD_SLOT_CHANCE", name: "3件目が出る確率", desc: "2件目が出た場合のみ抽選。0〜1の割合", isPct: true },
  { key: "QUEST_COOLDOWN_DAYS", name: "再抽選クールダウン(日)", desc: "一度張り出された依頼が外れてから、再抽選対象に戻るまでの日数" },
  { key: "QUEST_DEADLINE_DAYS", name: "受注後の期限(日)", desc: "受注してからこの日数以内に達成しないと失敗になる" },
  { key: "QUEST_CONTRACT_FEE_DIVISOR", name: "契約金の割合(分母)", desc: "契約金 = 報酬金 ÷ この値。受注時に前払いし達成時に全額返還、失敗/取り下げで没収" },
  { key: "QUEST_GOLD_PER_FLOOR", name: "報酬金の階層係数", desc: "報酬金(自動計算時) = targetFloor × この値 × 報酬倍率" },
  { key: "QUEST_REWARD_MULT", name: "報酬金の倍率", desc: "報酬金(自動計算時)の最終倍率" },
  { key: "QUEST_REWARD_XP", name: "討伐報酬XP", desc: "現在は0(金銭報酬のみ)固定で運用中" },
  { key: "RESCUE_QUEST_GOLD_THRESHOLD", name: "救済クエスト発生: 所持金しきい値", desc: "所持金がこの値以下の時だけ張り出される" },
  { key: "RESCUE_QUEST_MAX_ACTIVE_MEMBERS", name: "救済クエスト発生: 稼働人数しきい値", desc: "瀕死/ロストを除く稼働中の仲間がこの人数以下の時だけ張り出される" },
  { key: "CHASE_ENCOUNTER_CHANCE", name: "討伐対象の追跡遭遇率", desc: "討伐せず逃げた対象が、以後フロア移動のたびに追いついてくる確率", isPct: true },
  { key: "BOSS_FLEE_HP_RATIO", name: "ボスの逃走HP割合", desc: "ボス/中ボスがこのHP割合以下で自分の手番が来ると逃走する", isPct: true },
  { key: "BOSS_PURSUIT_ENCOUNTER_CHANCE", name: "ボス追撃の遭遇率", desc: "逃走したボスが以後フロア移動のたびに追いついてくる確率", isPct: true },
];

const MAT_IDS = ["kawa", "hone", "ki", "tetsu"];
const MAT_LABEL = { kawa: "皮", hone: "骨", ki: "木", tetsu: "鉄" };

let edits = { quests: {}, rescue: {}, constants: {}, routes: {} };
let addedQuests = {}; // id -> フルの依頼オブジェクト(新規追加分)
let deletedQuestIds = new Set();
let addedRoutes = {}; // id -> フルのクエストダンジョン(ルート)オブジェクト(新規追加分)
let deletedRouteIds = new Set();
let activeSection = "tier1"; // tier1 | tier2 | routes | bgsets | rescue | settings
let searchQuery = "";

function baseQuestIds(tier) {
  return Object.keys(QUEST_DATA.quests).filter((id) => QUEST_DATA.quests[id].tier === tier);
}
function addedQuestIds(tier) {
  return Object.keys(addedQuests).filter((id) => addedQuests[id].tier === tier);
}
function isNewQuest(id) { return Object.prototype.hasOwnProperty.call(addedQuests, id); }
function questSource(id) { return isNewQuest(id) ? addedQuests[id] : QUEST_DATA.quests[id]; }
// ルート(クエストダンジョン)側も依頼と同じ「既存への差分編集+新規追加+削除予定」の3層で管理する
function isNewRoute(id) { return Object.prototype.hasOwnProperty.call(addedRoutes, id); }
function routeSource(id) { return isNewRoute(id) ? addedRoutes[id] : QUEST_DATA.routes[id]; }
function setRouteEdit(id, field, value, original) {
  if (isNewRoute(id)) { addedRoutes[id][field] = value; return; }
  edits.routes[id] = edits.routes[id] || {};
  // segmentsは配列値のためJSON文字列化で比較する(依頼のrewardMaterialsと同じ理由)
  if (JSON.stringify(value) === JSON.stringify(original)) delete edits.routes[id][field];
  else edits.routes[id][field] = value;
  if (Object.keys(edits.routes[id]).length === 0) delete edits.routes[id];
}
function currentRouteValue(id, field, original) {
  if (isNewRoute(id)) return addedRoutes[id][field];
  const e = edits.routes[id];
  return e && Object.prototype.hasOwnProperty.call(e, field) ? e[field] : original;
}
function isRouteEdited(id) { return isNewRoute(id) || !!(edits.routes[id] && Object.keys(edits.routes[id]).length); }
function routeOptionIds() {
  return [...Object.keys(QUEST_DATA.routes).filter((id) => !deletedRouteIds.has(id)), ...Object.keys(addedRoutes)];
}

// 注意: ここでは全体再描画(refreshAll/renderMain)を呼ばない。以前は毎回呼んでいたため、
// 1文字入力するたびにカード一覧が丸ごと作り直されて<details>が閉じてしまい入力できない不具合が
// あった(ユーザー報告)。データを更新するだけに留め、見た目の反映は呼び出し元(input側)が
// classList.toggle/refreshEditCount等の軽量な更新で行う。カードの構成そのものが変わる操作
// (削除/追加/ランク変更/検索/タブ切り替え)だけは引き続き呼び出し元でrefreshAll()する
function setQuestEdit(id, field, value, original) {
  if (isNewQuest(id)) { addedQuests[id][field] = value; return; }
  edits.quests[id] = edits.quests[id] || {};
  // rewardMaterialsはオブジェクト値のため単純な===比較ではなくJSON文字列化して比較する(値は変わらない)
  if (JSON.stringify(value) === JSON.stringify(original) || (value === "" && (original === undefined || original === null))) delete edits.quests[id][field];
  else edits.quests[id][field] = value;
  if (Object.keys(edits.quests[id]).length === 0) delete edits.quests[id];
}
function currentQuestValue(id, field, original) {
  if (isNewQuest(id)) return addedQuests[id][field];
  const e = edits.quests[id];
  return e && Object.prototype.hasOwnProperty.call(e, field) ? e[field] : original;
}
function isQuestEdited(id) { return isNewQuest(id) || !!(edits.quests[id] && Object.keys(edits.quests[id]).length); }
function resetQuest(id) {
  if (isNewQuest(id)) { delete addedQuests[id]; }
  else delete edits.quests[id];
  refreshAll();
}
function setRescueEdit(field, value, original) {
  if (JSON.stringify(value) === JSON.stringify(original)) delete edits.rescue[field];
  else edits.rescue[field] = value;
}
function currentRescueValue(field, original) {
  return Object.prototype.hasOwnProperty.call(edits.rescue, field) ? edits.rescue[field] : original;
}
function setConstEdit(key, value, original) {
  if (value === original) delete edits.constants[key];
  else edits.constants[key] = value;
}
function currentConstValue(key, original) {
  return Object.prototype.hasOwnProperty.call(edits.constants, key) ? edits.constants[key] : original;
}
function countEdits() {
  let n = Object.keys(edits.quests).reduce((s, id) => s + Object.keys(edits.quests[id]).length, 0);
  n += Object.keys(addedQuests).length;
  n += deletedQuestIds.size;
  n += Object.keys(edits.routes).reduce((s, id) => s + Object.keys(edits.routes[id]).length, 0);
  n += Object.keys(addedRoutes).length;
  n += deletedRouteIds.size;
  n += Object.keys(edits.rescue).length;
  n += Object.keys(edits.constants).length;
  return n;
}
function sectionHasEdits(sec) {
  if (sec === "tier1" || sec === "tier2") {
    const tierNum = sec === "tier1" ? 1 : 2;
    const editedExisting = Object.keys(edits.quests).some((id) => QUEST_DATA.quests[id] && QUEST_DATA.quests[id].tier === tierNum);
    const addedInTier = addedQuestIds(tierNum).length > 0;
    const deletedInTier = [...deletedQuestIds].some((id) => QUEST_DATA.quests[id] && QUEST_DATA.quests[id].tier === tierNum);
    return editedExisting || addedInTier || deletedInTier;
  }
  if (sec === "routes") return Object.keys(edits.routes).length > 0 || Object.keys(addedRoutes).length > 0 || deletedRouteIds.size > 0;
  if (sec === "rescue") return Object.keys(edits.rescue).length > 0;
  if (sec === "settings") return Object.keys(edits.constants).length > 0;
  return false; // bgsetsタブはサーバー直書き(編集バッファを持たない)ため常にfalse
}

function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  const fields = ["emoji", "requester", "title", "text", "targetFloor", "count", "tier", "rewardGold", "spawnId", "chaseText", "minQuestClears"];
  const REQUIRED_NUMERIC = new Set(["targetFloor", "count"]); // 空欄を許さず元の値へフォールバックする
  const OPTIONAL_NUMERIC = new Set(["rewardGold", "minQuestClears"]); // 空欄=null(未設定)として明示的に書き出す
  const emojiPreviewEl = node.querySelector(".quest-emoji-badge");
  const titlePreviewEl = node.querySelector(".quest-title-preview");
  const floorPreviewEl = node.querySelector(".quest-meta-badge");

    const originalVal = src[f];
    el.addEventListener("input", () => {
      let v = el.value;
      if (f === "tier") { /* handled separately below via change */ return; }
      // JSON.stringifyはundefinedのプロパティを黙って消してしまうため、空欄=未設定はnullとして持つ
      // (nullなら書き出される)。targetFloor/countは必須項目なので空欄時は元の値へフォールバックする
      if (REQUIRED_NUMERIC.has(f)) v = v === "" ? originalVal : Number(v);
      else if (OPTIONAL_NUMERIC.has(f)) v = v === "" ? null : Number(v);
      setQuestEdit(id, f, v, originalVal);
      // カード折りたたみ時のプレビュー(絵文字/依頼名/目標階層)だけはその場でテキストを直接書き換える
      // (全体再描画はしない、上のコメント参照)
      if (f === "emoji") emojiPreviewEl.textContent = v || "❓";
      if (f === "title") titlePreviewEl.textContent = v || "(無題)";
      if (f === "targetFloor") floorPreviewEl.textContent = `Lv${v}〜`;
      node.classList.toggle("edited", isQuestEdited(id));
      refreshEditCount();
    });
  });
  const tierSelect = node.querySelector('[data-field="tier"]');
  tierSelect.addEventListener("change", () => {
    setQuestEdit(id, "tier", Number(tierSelect.value), src.tier);
    renderMain(); // タブが変わるので全体再描画
  });
  const routeSelect = node.querySelector('[data-field="route"]');
  routeSelect.addEventListener("change", () => {
    // 空欄=未設定はnullで持つ(既存のrouteを外す編集も差分として書き出せるように)
    setQuestEdit(id, "route", routeSelect.value === "" ? null : routeSelect.value, src.route == null ? null : src.route);
    node.classList.toggle("edited", isQuestEdited(id));
    refreshEditCount();
  });
  node.querySelectorAll("[data-quest-mats-id]").forEach((el) => {
    const mid = el.dataset.questMatsId;
    el.addEventListener("input", () => {
      const newMats = Object.assign({}, rewardMaterials);
      newMats[mid] = el.value === "" ? 0 : Number(el.value);
      setQuestEdit(id, "rewardMaterials", newMats, src.rewardMaterials || {});
      node.classList.toggle("edited", isQuestEdited(id));
      refreshEditCount();
    });
  });
  const requiresCheckbox = node.querySelector('[data-field="requiresOoInoshishi"]');
  requiresCheckbox.addEventListener("change", () => {
    setQuestEdit(id, "requiresOoInoshishi", requiresCheckbox.checked, !!src.requiresOoInoshishi);
    node.classList.toggle("edited", isQuestEdited(id));
    refreshEditCount();
  });
  const resetBtn = node.querySelector(".reset-btn");
  resetBtn.addEventListener("click", (e) => { e.preventDefault(); resetQuest(id); });
  const delBtn = node.querySelector(".del-btn");
  // 新規追加した依頼を削除する場合は「追加の取り消し」であり、既存依頼の削除(deletedQuestIds)とは
  // 別枠(newQuestsから消すだけ)。混ぜるとエクスポートにnewQuests/deletedQuestIds両方に載って矛盾するため分岐する
  if (delBtn) delBtn.addEventListener("click", (e) => { e.preventDefault(); if (isNewQuest(id)) delete addedQuests[id]; else deletedQuestIds.add(id); refreshAll(); });
  const undoBtn = node.querySelector(".undo-del-btn");
  if (undoBtn) undoBtn.addEventListener("click", (e) => { e.preventDefault(); deletedQuestIds.delete(id); refreshAll(); });
  return node;
}

function matchesSearch(id) {
  if (!searchQuery) return true;
  const src = questSource(id);
  const title = currentQuestValue(id, "title", src.title) || "";
  const requester = currentQuestValue(id, "requester", src.requester) || "";
  const text = currentQuestValue(id, "text", src.text) || "";
  const q = searchQuery.toLowerCase();
  return title.toLowerCase().includes(q) || requester.toLowerCase().includes(q) || text.toLowerCase().includes(q) || id.toLowerCase().includes(q);
}

function renderTierSection(tierNum) {
  const container = document.createElement("div");
  const ids = [...baseQuestIds(tierNum), ...addedQuestIds(tierNum)].filter((id) => {
    // tier編集で他ランクへ移動した既存依頼はここでは除外する
    const src = questSource(id);
    const currentTier = currentQuestValue(id, "tier", src.tier);
    return currentTier === tierNum;
  }).filter(matchesSearch);
  if (!ids.length) {
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = searchQuery ? "該当する依頼が見つかりません" : "依頼がありません";
    container.appendChild(hint);
  }
  ids.forEach((id) => container.appendChild(buildQuestCard(id)));
  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "add-quest-btn";
  addBtn.textContent = `+ ★${tierNum}に新しい依頼を追加`;
  addBtn.addEventListener("click", () => {
    let newId = (prompt("新しい依頼のID(英数字、既存と重複しないもの。例: yamaneko)") || "").trim();
    if (!newId) return;
    newId = newId.replace(/[^a-zA-Z0-9_]/g, "");
    if (!newId) { alert("英数字・アンダースコアのみ使用できます"); return; }
    if (QUEST_DATA.quests[newId] || addedQuests[newId]) { alert("そのIDは既に使われています"); return; }
    addedQuests[newId] = { emoji: "❓", requester: "", title: "新しい依頼", text: "", targetFloor: 10, count: 1, tier: tierNum };
    refreshAll();
  });
  container.appendChild(addBtn);
  return container;
}

const PHASE_KEYS = ["dawn", "asa", "day", "dusk", "night"];
const PHASE_LABEL = { dawn: "早朝", asa: "朝", day: "昼", dusk: "夕", night: "夜" };
let gameBgSetNames = []; // ゲーム本体ui.jsのBG_SETSキー(=反映済みの背景セット名)
let kvBgSets = [];       // /api/bgsets の一覧 [{name, phases:[...]}](預かり所にアップロード済み、未反映含む)
let bgSourcesLoaded = false;
async function loadBgSetSources() {
  // 反映済みセット名はui.jsのソースから直接拾う(直結方針。エディタ内にコピーを持たない)
  try {
    const txt = await (await fetch("ui.js")).text();
    const m = txt.match(/const BG_SETS = \{([\s\S]*?)\n\};/);
    if (m) gameBgSetNames = [...m[1].matchAll(/^\s*([A-Za-z0-9_]+):/gm)].map((x) => x[1]);
  } catch (e) { /* file://直開き等でui.jsが読めない場合は選択肢が減るだけで編集自体は可能 */ }
  try {
    const res = await fetch("/api/bgsets");
    if (res.ok) kvBgSets = await res.json();
  } catch (e) { /* ローカル起動などAPIが無い環境ではアップロード済み一覧なしで動く */ }
  bgSourcesLoaded = true;
  if (activeSection === "routes" || activeSection === "bgsets") renderMain();
}
function bgSetOptionNames() {
  const names = [...gameBgSetNames];
  kvBgSets.forEach((s) => { if (!names.includes(s.name)) names.push(s.name); });
  return names.length ? names : ["dungeon"];
}
function enemyOptionList() {
  return Object.values(ENEMIES).map((e) => ({ id: e.id, ja: e.ja })).sort((a, b) => a.ja.localeCompare(b.ja, "ja"));
}

    </summary>
    <div class="quest-body">
      <div class="field-pair">
        <div class="field-row" style="flex:0 0 60px;">
          <label>絵文字</label>
          <input type="text" data-rfield="emoji" value="${escapeHtml(emoji || "")}" maxlength="4">
        </div>
        <div class="field-row">
          <label>ルート名(出発時の選択肢に出る)</label>
          <input type="text" data-rfield="ja" value="${escapeHtml(ja || "")}">
        </div>
        <div class="field-row" style="flex:0 0 80px;">
          <label>全長(層)</label>
          <input type="number" data-rfield="totalFloors" value="${totalFloors}" min="1">
        </div>
      </div>
      <div class="field-row">
        <label>区間(◯層目からの背景と敵。現在層以下で一番大きい「開始層」の区間が使われる)</label>
        <div class="segments-box"></div>
        <button type="button" class="add-seg-btn">+ 区間を追加</button>
      </div>
      <div class="quest-actions">
        <div class="quest-actions-left">
          <button type="button" class="reset-btn">↺ 元に戻す</button>
        </div>
        ${deleted ? `<button type="button" class="undo-del-btn">削除を取り消す</button>` : `<button type="button" class="del-btn">🗑 このルートを削除</button>`}
      </div>
    </div>
  `;
  const emojiPreviewEl = node.querySelector(".quest-emoji-badge");
  const titlePreviewEl = node.querySelector(".quest-title-preview");
  const floorsPreviewEl = node.querySelector(".quest-meta-badge");
  [["emoji", false], ["ja", false], ["totalFloors", true]].forEach(([f, numeric]) => {
    const el = node.querySelector(`[data-rfield="${f}"]`);
    const originalVal = src[f];
    el.addEventListener("input", () => {
      let v = el.value;
      if (numeric) v = v === "" ? originalVal : Number(v);
      setRouteEdit(id, f, v, originalVal);
      if (f === "emoji") emojiPreviewEl.textContent = v || "🗺";
      if (f === "ja") titlePreviewEl.textContent = v || "(無名ルート)";
      if (f === "totalFloors") floorsPreviewEl.textContent = `全${v}層`;
      node.classList.toggle("edited", isRouteEdited(id));
      refreshEditCount();
    });
  });
  // ---- 区間エディタ。データは常に「segments配列を丸ごと差し替え」で編集し、
  // 構造が変わる操作(区間や敵の追加/削除)だけこの箱の中を局所再構築する(カード全体は再描画しない=<details>が閉じない) ----
  const segBox = node.querySelector(".segments-box");
  function currentSegments() { return currentRouteValue(id, "segments", src.segments) || []; }
  function commitSegments(next) {
    setRouteEdit(id, "segments", next, src.segments || []);
    node.classList.toggle("edited", isRouteEdited(id));
    refreshEditCount();
  }
  function cloneSegments() { return JSON.parse(JSON.stringify(currentSegments())); }
  function rebuildSegments() {
    segBox.innerHTML = "";
    const segs = currentSegments();
    if (!segs.length) {
      const p = document.createElement("div");
      p.className = "seg-empty";
      p.textContent = "区間がありません(最低1つ追加してください。例: 1層目から 背景dungeon=森)";
      segBox.appendChild(p);
    }
    segs.forEach((seg, idx) => segBox.appendChild(buildSegmentRow(seg, idx)));
  }
  function buildSegmentRow(seg, idx) {
    const row = document.createElement("div");
    row.className = "seg-row";
    const bgNames = bgSetOptionNames();
    if (seg.bg && !bgNames.includes(seg.bg)) bgNames.push(seg.bg);
    row.innerHTML = `
      <div class="seg-head">
        <span class="seg-from"><input type="number" class="seg-from-input" value="${seg.fromFloor}" min="1">層目から</span>
        <select class="seg-bg-select">
          ${bgNames.map((n) => `<option value="${escapeHtml(n)}" ${seg.bg === n ? "selected" : ""}>${escapeHtml(n)}${gameBgSetNames.length && !gameBgSetNames.includes(n) ? "(未反映)" : ""}</option>`).join("")}
        </select>
        <button type="button" class="seg-del">✕</button>
      </div>
      <div class="seg-enemies"></div>
    `;
    row.querySelector(".seg-from-input").addEventListener("input", (e) => {
      // 入力中の並べ替えはしない(フォーカスが飛ぶため)。fromFloor順の解決はゲーム側適用時に行う
      const next = cloneSegments();
      next[idx].fromFloor = e.target.value === "" ? 1 : Number(e.target.value);
      commitSegments(next);
    });
    row.querySelector(".seg-bg-select").addEventListener("change", (e) => {
      const next = cloneSegments();
      next[idx].bg = e.target.value;
      commitSegments(next);
    });
    row.querySelector(".seg-del").addEventListener("click", () => {
      const next = cloneSegments();
      next.splice(idx, 1);
      commitSegments(next);
      rebuildSegments();
    });
    const enemiesBox = row.querySelector(".seg-enemies");
    (seg.enemies || []).forEach((eid, eIdx) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "enemy-chip";
      const def = ENEMIES[eid];
      chip.textContent = (def ? def.ja : eid) + " ✕";
      chip.title = eid;
      chip.addEventListener("click", () => {
        const next = cloneSegments();
        next[idx].enemies.splice(eIdx, 1);
        commitSegments(next);
        rebuildSegments();
      });
      enemiesBox.appendChild(chip);
    });
    const sel = document.createElement("select");
    sel.className = "enemy-add-select";
    sel.innerHTML = `<option value="">＋敵を追加(空のままなら森の通常抽選)</option>` +
      enemyOptionList().map((e) => `<option value="${escapeHtml(e.id)}">${escapeHtml(e.ja)}(${escapeHtml(e.id)})</option>`).join("");
    sel.addEventListener("change", () => {
      if (!sel.value) return;
      const next = cloneSegments();
      next[idx].enemies = next[idx].enemies || [];
      next[idx].enemies.push(sel.value);
      commitSegments(next);
      rebuildSegments();
    });
    enemiesBox.appendChild(sel);
    return row;
  }
  node.querySelector(".add-seg-btn").addEventListener("click", () => {
    const next = cloneSegments();
    const lastFrom = next.length ? Number(next[next.length - 1].fromFloor) || 0 : 0;
    const defaultBg = bgSetOptionNames().includes("dungeon") ? "dungeon" : bgSetOptionNames()[0];
    next.push({ fromFloor: lastFrom + 1, bg: defaultBg, enemies: [] });
    commitSegments(next);
    rebuildSegments();
  });
  node.querySelector(".reset-btn").addEventListener("click", (e) => { e.preventDefault(); if (isNewRoute(id)) delete addedRoutes[id]; else delete edits.routes[id]; refreshAll(); });
  const delBtn = node.querySelector(".del-btn");
  if (delBtn) delBtn.addEventListener("click", (e) => { e.preventDefault(); if (isNewRoute(id)) delete addedRoutes[id]; else deletedRouteIds.add(id); refreshAll(); });
  const undoBtn = node.querySelector(".undo-del-btn");
  if (undoBtn) undoBtn.addEventListener("click", (e) => { e.preventDefault(); deletedRouteIds.delete(id); refreshAll(); });
  rebuildSegments();
  return node;
}

function downscaleImage(file, maxEdge = 1600) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let out = canvas.toDataURL("image/jpeg", 0.85);
      if (out.length > 3800000) out = canvas.toDataURL("image/jpeg", 0.7); // KV側の4MB制限に収める
      if (out.length > 3800000) reject(new Error("画像が大きすぎます"));
      else resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

function buildBgSetCard(set) {
  const inGame = gameBgSetNames.includes(set.name);
  const node = document.createElement("details");
  node.className = "quest-card";
  node.innerHTML = `
    <summary>
      <span class="quest-emoji-badge">🖼</span>
      <span class="quest-title-preview">${escapeHtml(set.name)}</span>
      <span class="quest-meta-badge">${set.phases.length}/5枚${inGame ? "・ゲーム反映済み" : ""}</span>
      <span class="quest-chevron">▶</span>
    </summary>
    <div class="quest-body">
      <div class="bgset-phases"></div>
      <div class="quest-actions">
        <div></div>
        <button type="button" class="del-btn">🗑 このセットを預かり所から削除</button>
      </div>
    </div>
  `;
  const metaBadge = node.querySelector(".quest-meta-badge");
  const phasesBox = node.querySelector(".bgset-phases");
  PHASE_KEYS.forEach((phase) => {
    const row = document.createElement("div");
    row.className = "bgset-phase-row";
    const has = set.phases.includes(phase);
    row.innerHTML = `
      <span class="bgset-phase-label">${PHASE_LABEL[phase]}</span>
      <img class="bgset-thumb" alt="" style="display:none;">
      <span class="bgset-status">${has ? "✅ アップロード済み" : "— 未アップロード"}</span>
      <label class="bgset-file-btn">${has ? "差し替え" : "写真を選ぶ"}<input type="file" accept="image/*" hidden></label>
    `;
    const input = row.querySelector("input[type=file]");
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const statusEl = row.querySelector(".bgset-status");
      const thumbEl = row.querySelector(".bgset-thumb");
      statusEl.textContent = "⏳ 変換中…";
      try {
        const dataUrl = await downscaleImage(file);
        statusEl.textContent = "⏳ アップロード中…";
        const res = await fetch("/api/bgsets", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: set.name, phase, image: dataUrl }) });
        if (!res.ok) throw new Error(await res.text());
        statusEl.textContent = "✅ アップロード済み";
        thumbEl.src = dataUrl;
        thumbEl.style.display = "inline-block";
        if (!set.phases.includes(phase)) set.phases.push(phase);
        metaBadge.textContent = `${set.phases.length}/5枚${inGame ? "・ゲーム反映済み" : ""}`;
      } catch (e) {
        statusEl.textContent = "❌ 失敗: " + e.message;
      }
    });
    phasesBox.appendChild(row);
  });
  // 開いた時に一度だけ、アップロード済み画像のサムネイルを取得して埋める
  let thumbsLoaded = false;
  node.addEventListener("toggle", async () => {
    if (!node.open || thumbsLoaded || !set.phases.length) return;
    thumbsLoaded = true;
    try {
      const res = await fetch("/api/bgsets/" + set.name);
      if (!res.ok) return;
      const data = await res.json();
      phasesBox.querySelectorAll(".bgset-phase-row").forEach((row, i) => {
        const img = row.querySelector(".bgset-thumb");
        if (data.images[PHASE_KEYS[i]] && !img.src) {
          img.src = data.images[PHASE_KEYS[i]];
          img.style.display = "inline-block";
        }
      });
    } catch (e) {}
  });
  node.querySelector(".del-btn").addEventListener("click", async () => {
    if (!confirm(`背景セット「${set.name}」を預かり所から削除します(ゲームに反映済みの画像はそのまま残ります)。よろしいですか？`)) return;
    try {
      await fetch("/api/bgsets/" + set.name, { method: "DELETE" });
      kvBgSets = kvBgSets.filter((s) => s.name !== set.name);
      renderMain();
    } catch (e) { alert("削除に失敗しました: " + e.message); }
  });
  return node;
}

function renderBgSetsSection() {
  const container = document.createElement("div");
  const hint = document.createElement("p");
  hint.className = "empty-hint";
  hint.style.cssText = "padding:6px 10px 0; text-align:left;";
  hint.textContent = "ルート用の背景写真をスマホからアップロードする預かり所。セット名を決めて写真を入れておくと、Claudeが圧縮してゲーム(assets/bg/)へ反映する。開発中はまず昼1枚だけでOK(足りない時間帯は反映時に昼で代用される)。早朝/朝/夕/夜は後から追加アップロードすれば差し替わる。写真は端末上で自動縮小してから送られる。";
  container.appendChild(hint);
  if (!bgSourcesLoaded) {
    const p = document.createElement("div");
    p.className = "empty-hint";
    p.textContent = "読み込み中…";
    container.appendChild(p);
    return container;
  }
  const newRow = document.createElement("div");
  newRow.className = "bgset-new-row";
  newRow.innerHTML = `<input type="text" id="newBgSetName" placeholder="新しいセット名(英小文字。例: numachi)" autocapitalize="off" autocorrect="off"><button type="button" id="createBgSetBtn">枠を作る</button>`;
  newRow.querySelector("#createBgSetBtn").addEventListener("click", () => {
    const name = newRow.querySelector("#newBgSetName").value.trim();
    if (!/^[a-z][a-z0-9_]{1,29}$/.test(name)) { alert("セット名は英小文字で始まる小文字英数字/アンダースコア(2〜30文字)にしてください"); return; }
    if (kvBgSets.some((s) => s.name === name)) { alert("そのセット名は既に預かり所にあります"); return; }
    if (gameBgSetNames.includes(name)) { alert("そのセット名は既にゲーム側(BG_SETS)で使われています"); return; }
    kvBgSets.push({ name, phases: [] });
    renderMain();
  });
  container.appendChild(newRow);
  if (!kvBgSets.length) {
    const p = document.createElement("div");
    p.className = "empty-hint";
    p.textContent = "預かり所にセットがありません。上でセット名を決めて枠を作ってください。";
    container.appendChild(p);
  }
  kvBgSets.forEach((set) => container.appendChild(buildBgSetCard(set)));
  if (gameBgSetNames.length) {
    const p = document.createElement("p");
    p.className = "empty-hint";
    p.style.textAlign = "left";
    p.textContent = "ゲームに反映済みの背景セット: " + gameBgSetNames.join(", ");
    container.appendChild(p);
  }
  return container;
}

function buildExportData() {
  const out = {};
  if (Object.keys(edits.quests).length) out.quests = edits.quests;
  if (Object.keys(addedQuests).length) out.newQuests = addedQuests;
  if (deletedQuestIds.size) out.deletedQuestIds = [...deletedQuestIds];
  if (Object.keys(edits.routes).length) out.routes = edits.routes;
  if (Object.keys(addedRoutes).length) out.newRoutes = addedRoutes;
  if (deletedRouteIds.size) out.deletedRouteIds = [...deletedRouteIds];
  if (Object.keys(edits.rescue).length) out.rescue = edits.rescue;
  if (Object.keys(edits.constants).length) out.constants = edits.constants;
  return out;
}
function buildDiffListHtml() {
  const parts = [];
  Object.keys(edits.quests).forEach((id) => {
    const fields = edits.quests[id];
    const title = QUEST_DATA.quests[id] ? QUEST_DATA.quests[id].title : id;
    const fieldLines = Object.keys(fields).map((f) => {
      const from = QUEST_DATA.quests[id][f];
      const to = fields[f];
      return `<div class="diff-field">${escapeHtml(f)}: <del>${escapeHtml(JSON.stringify(from))}</del> → <ins>${escapeHtml(JSON.stringify(to))}</ins></div>`;
    }).join("");
    parts.push(`<div class="diff-item"><div class="diff-title">✎ ${escapeHtml(title)}(${escapeHtml(id)})</div>${fieldLines}</div>`);
  });
  Object.keys(addedQuests).forEach((id) => {
    parts.push(`<div class="diff-item"><div class="diff-title">＋新規: ${escapeHtml(addedQuests[id].title)}(${escapeHtml(id)})</div></div>`);
  });
  [...deletedQuestIds].forEach((id) => {
    const title = QUEST_DATA.quests[id] ? QUEST_DATA.quests[id].title : id;
    parts.push(`<div class="diff-item"><div class="diff-title" style="color:var(--danger);">🗑削除: ${escapeHtml(title)}(${escapeHtml(id)})</div></div>`);
  });
  Object.keys(edits.routes).forEach((id) => {
    const fields = edits.routes[id];
    const title = QUEST_DATA.routes[id] ? QUEST_DATA.routes[id].ja : id;
    const fieldLines = Object.keys(fields).map((f) => `<div class="diff-field">${escapeHtml(f)}: <del>${escapeHtml(JSON.stringify(QUEST_DATA.routes[id][f]))}</del> → <ins>${escapeHtml(JSON.stringify(fields[f]))}</ins></div>`).join("");
    parts.push(`<div class="diff-item"><div class="diff-title">✎ ルート: ${escapeHtml(title)}(${escapeHtml(id)})</div>${fieldLines}</div>`);
  });
  Object.keys(addedRoutes).forEach((id) => {
    parts.push(`<div class="diff-item"><div class="diff-title">＋新規ルート: ${escapeHtml(addedRoutes[id].ja)}(${escapeHtml(id)})</div></div>`);
  });
  [...deletedRouteIds].forEach((id) => {
    const title = QUEST_DATA.routes[id] ? QUEST_DATA.routes[id].ja : id;
    parts.push(`<div class="diff-item"><div class="diff-title" style="color:var(--danger);">🗑ルート削除: ${escapeHtml(title)}(${escapeHtml(id)})</div></div>`);
  });
  if (Object.keys(edits.rescue).length) {
    const fieldLines = Object.keys(edits.rescue).map((f) => `<div class="diff-field">${escapeHtml(f)}: <del>${escapeHtml(JSON.stringify(QUEST_DATA.rescue[f]))}</del> → <ins>${escapeHtml(JSON.stringify(edits.rescue[f]))}</ins></div>`).join("");
    parts.push(`<div class="diff-item"><div class="diff-title">✎ 救済クエスト</div>${fieldLines}</div>`);
  }
  if (Object.keys(edits.constants).length) {
    const fieldLines = Object.keys(edits.constants).map((k) => `<div class="diff-field">${escapeHtml(k)}: <del>${escapeHtml(JSON.stringify(QUEST_DATA.constants[k]))}</del> → <ins>${escapeHtml(JSON.stringify(edits.constants[k]))}</ins></div>`).join("");
    parts.push(`<div class="diff-item"><div class="diff-title">✎ 全体設定</div>${fieldLines}</div>`);
  }
  return parts.length ? parts.join("") : '<div class="empty-hint">まだ編集がありません</div>';
}

});

// ==== 一時保存(チェックポイント)。編集途中の状態(edits/addedQuests/deletedQuestIds)をJSONで
// 出し入れできるようにする。localStorageに頼らず(別端末/別ブラウザでも使えるように)コピペで運用する ====
function buildCheckpointData() {
  return { edits, addedQuests, deletedQuestIds: [...deletedQuestIds], addedRoutes, deletedRouteIds: [...deletedRouteIds] };
}
document.getElementById("checkpointBtn").addEventListener("click", () => {
  document.getElementById("checkpointJson").value = JSON.stringify(buildCheckpointData(), null, 2);
  document.getElementById("checkpointImportInput").value = "";
  document.getElementById("checkpointImportStatus").textContent = "";
  document.getElementById("checkpointModal").classList.add("open");
});
document.getElementById("closeCheckpointBtn").addEventListener("click", () => document.getElementById("checkpointModal").classList.remove("open"));
document.getElementById("copyCheckpointBtn").addEventListener("click", () => {
  const ta = document.getElementById("checkpointJson");
  ta.select();
  document.execCommand("copy");
  const btn = document.getElementById("copyCheckpointBtn");
  const orig = btn.textContent;
  btn.textContent = "コピーしました";
  setTimeout(() => { btn.textContent = orig; }, 1200);
});
// チェックポイントの読み込みはマージ方式(既存の編集内容を消さず、貼り付けた分を上書き統合する)。
// 同じ端末で複数回に分けて一時保存→読み込みを繰り返しても、それまでの作業が失われないようにするため
document.getElementById("loadCheckpointBtn").addEventListener("click", () => {
  const statusEl = document.getElementById("checkpointImportStatus");
  const raw = document.getElementById("checkpointImportInput").value.trim();
  if (!raw) { statusEl.textContent = "JSONを貼り付けてください"; statusEl.style.color = "var(--danger)"; return; }
  let parsed;
  try { parsed = JSON.parse(raw); } catch (e) { statusEl.textContent = "JSONの読み込みに失敗しました: " + e.message; statusEl.style.color = "var(--danger)"; return; }
  try {
    if (parsed.edits) {
      Object.keys(parsed.edits.quests || {}).forEach((id) => { edits.quests[id] = Object.assign({}, edits.quests[id] || {}, parsed.edits.quests[id]); });
      Object.keys(parsed.edits.routes || {}).forEach((id) => { edits.routes[id] = Object.assign({}, edits.routes[id] || {}, parsed.edits.routes[id]); });
      Object.assign(edits.rescue, parsed.edits.rescue || {});
      Object.assign(edits.constants, parsed.edits.constants || {});
    }
    Object.assign(addedQuests, parsed.addedQuests || {});
    (parsed.deletedQuestIds || []).forEach((id) => deletedQuestIds.add(id));
    Object.assign(addedRoutes, parsed.addedRoutes || {});
    (parsed.deletedRouteIds || []).forEach((id) => deletedRouteIds.add(id));
    statusEl.textContent = "読み込みました";
    statusEl.style.color = "var(--success)";
    refreshAll();
  } catch (e) {
    statusEl.textContent = "読み込み中にエラーが発生しました: " + e.message;
    statusEl.style.color = "var(--danger)";
  }
});

renderMain();
loadBgSetSources(); // 背景セットの選択肢(ui.jsのBG_SETS+預かり所)は非同期で読み、揃い次第ルート/背景タブを再描画する
</script>
</body>
</html>
