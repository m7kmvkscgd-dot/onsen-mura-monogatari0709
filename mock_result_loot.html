<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>リザルト素材欄モック</title>
<style>
  /* リザルト画面(冒険の記録)への素材集計欄の提案モック(ゲーム本体には未実装)。
     本物のresult.css/ui.js renderResultScreenの構成を簡略コピーし、「収穫」ゴールドの直下に
     素材チップ行(高さ約28px)を足した姿を再現する。1画面完結(スクロール不要)は維持 */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #14100c; color: #e8e0d0;
    display: flex; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { position: relative; width: 100%; max-width: 480px; height: 100dvh; overflow: hidden; }
  .hero-bg {
    position: absolute; inset: 0;
    background: url("assets/bg/forest_dusk.jpg") center / cover no-repeat #1a1410;
  }
  .hero-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(16,12,8,0.35), rgba(16,12,8,0.82) 34%, rgba(16,12,8,0.94));
  }
  .dw-header {
    position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; font-size: 0.78rem; color: #d9c49a;
  }
  .dw-header .back { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(217,196,154,0.4); background: rgba(0,0,0,0.35); color: #d9c49a; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
  .hero-title { position: relative; z-index: 2; text-align: center; font-size: 1.35rem; font-weight: 900; letter-spacing: 0.25em; color: #e8dcbf; text-shadow: 0 2px 8px rgba(0,0,0,0.8); margin-top: 2px; }

  .body-pad { position: relative; z-index: 2; padding: 10px 12px 0; margin-top: 10px; }

  /* 額装パネル(resultScrollPanelの簡略コピー) */
  .panel {
    position: relative;
    border: 2px solid #4b3728; border-radius: 10px;
    outline: 1px solid rgba(217,196,154,0.75); outline-offset: -5px;
    padding: 12px 12px 12px;
    background:
      radial-gradient(circle at 0 0, rgba(217,196,154,0.14) 0, rgba(217,196,154,0) 26px),
      radial-gradient(circle at 100% 0, rgba(217,196,154,0.14) 0, rgba(217,196,154,0) 26px),
      radial-gradient(circle at 0 100%, rgba(217,196,154,0.14) 0, rgba(217,196,154,0) 26px),
      radial-gradient(circle at 100% 100%, rgba(217,196,154,0.14) 0, rgba(217,196,154,0) 26px),
      linear-gradient(180deg, rgba(46,37,26,0.93) 0%, rgba(24,20,16,0.95) 100%);
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
  }
  .reveal { opacity: 0; transform: translateY(6px); }
  .reveal.in { opacity: 1; transform: translateY(0); transition: opacity 0.3s ease-out, transform 0.3s ease-out; }

  #gold { margin: 0.1rem 0 0; font-size: 1.3rem; font-weight: 800; color: #e5c878; }

  /* ★提案の素材チップ行: 高さ約28px、1行に横並び。ここだけが今回の追加要素 */
  .mat-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .mat-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(64,50,36,0.85); border: 1px solid rgba(217,196,154,0.4);
    border-radius: 14px; padding: 2px 9px 2px 4px;
    font-size: 0.78rem; font-weight: 800; color: #ffe9b0;
    opacity: 0;
  }
  .mat-chip img { width: 20px; height: 20px; object-fit: contain; }
  .mat-chip .orb { font-size: 15px; line-height: 20px; text-shadow: 0 0 8px rgba(255,214,102,0.9); }
  .mat-chip.rare { border-color: rgba(255,214,102,0.95); box-shadow: 0 0 8px rgba(255,190,60,0.5), inset 0 0 8px rgba(255,214,102,0.14); color: #ffd666; }

  #stats { margin-top: 0.4rem; font-size: 0.82rem; color: #d9c49a; letter-spacing: 0.06em; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
  #stats .alive { color: #d7b66f; font-weight: 700; }
  #xpHeading { margin: 0.6rem 0 0.45rem; font-size: 1rem; font-weight: 800; }

  .xp-list { display: grid; grid-template-columns: 1fr; gap: 0.45rem; }
  .xp-row {
    display: flex; gap: 0.6rem; align-items: flex-start; padding: 8px 10px;
    background: rgba(38,32,24,0.8); border: 1px solid rgba(217,196,154,0.2); border-radius: 8px;
  }
  .xp-row img { width: 32px; height: 32px; flex-shrink: 0; object-fit: contain; background: #353a44; border-radius: 6px; border: 1px solid rgba(217,196,154,0.35); }
  .xp-main { flex: 1; min-width: 0; }
  .xp-head { display: flex; justify-content: space-between; align-items: baseline; }
  .xp-head strong { font-size: 0.82rem; }
  .xp-head span { font-size: 0.8rem; color: #e5c878; }
  .xp-lv { font-size: 0.72rem; color: rgba(232,224,208,0.6); margin-top: 1px; }
  .xpbar { height: 7px; margin-top: 4px; background: rgba(0,0,0,0.55); border: 1px solid rgba(217,196,154,0.25); border-radius: 4px; overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: linear-gradient(to bottom, #d7b66f, #a8853f); width: 0%; }

  .stamp {
    position: absolute; top: 6px; right: 8px; z-index: 2; opacity: 0;
    width: 62px; height: 62px; display: flex; align-items: center; justify-content: center;
    border: 3px solid rgba(196,42,32,0.92); border-radius: 9px;
    box-shadow: inset 0 0 0 1px rgba(196,42,32,0.4);
    color: rgba(206,48,36,0.96); font-size: 2.2rem; font-weight: 900; font-family: serif;
    background: rgba(196,42,32,0.07);
    transform: rotate(-12deg); pointer-events: none;
  }

  .continue-btn {
    display: block; width: 100%; margin-top: 0.8rem; padding: 13px;
    font-family: inherit; font-size: 1rem; font-weight: 800; color: #241a0c;
    background: linear-gradient(160deg, #e0c078, #b8924a); border: 1px solid rgba(255,240,200,0.5);
    border-radius: 10px;
  }

  /* モック操作(画面右上の小さなピル。本物には無い) */
  .mock-ctrl { position: absolute; top: 44px; right: 8px; z-index: 10; display: flex; flex-direction: column; gap: 6px; }
  .mock-ctrl button {
    font-family: inherit; font-size: 0.66rem; font-weight: 700; color: #e8e0d0;
    background: rgba(20,26,32,0.85); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 12px; padding: 5px 10px;
  }
  .mock-note {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 10;
    font-size: 0.6rem; color: rgba(232,224,208,0.6); background: rgba(0,0,0,0.4);
    padding: 2px 10px; border-radius: 10px; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero-bg"></div>
  <div class="dw-header">
    <div class="back">←</div>
    <div>冒険の記録</div>
    <div>💰428G ・ 夕</div>
  </div>
  <div class="hero-title">冒険の記録</div>

  <div class="mock-ctrl">
    <button id="btnReplay">▶ 演出リプレイ</button>
    <button id="btnMembers">👥 4人版で確認</button>
  </div>

  <div class="body-pad">
    <div class="panel">
      <div class="stamp" id="stamp">竹</div>
      <h2 id="gold" class="reveal">収穫: +0G</h2>
      <!-- ★ここが提案の追加要素: 素材チップ行(1行・約28px)。他は現状のリザルトと同じ構成 -->
      <div class="mat-row" id="matRow"></div>
      <div id="stats" class="reveal">踏破 6層 ・ 討伐 14体 ・ <span class="alive">全員生還！</span></div>
      <h2 id="xpHeading" class="reveal">獲得経験値</h2>
      <div class="xp-list" id="xpList"></div>
    </div>
    <button class="continue-btn">町に戻る</button>
  </div>

  <div class="mock-note">リザルト素材欄モック(本体には未実装)</div>
</div>

<script>
(() => {
  const MEMBERS = [
    { img: "assets/class_samurai.png", name: "小太郎", cls: "侍", lv: 6, xp: 38, to: 74 },
    { img: "assets/class_onmyoji.png", name: "静", cls: "陰陽師", lv: 5, xp: 44, to: 89 },
    { img: "assets/class_hunter.png", name: "弥助", cls: "狩人", lv: 6, xp: 31, to: 61 },
    { img: "assets/class_ninja.png", name: "霧丸", cls: "忍者", lv: 4, xp: 27, to: 96 },
  ];
  const MATS = [
    { icon: "assets/icons/materials/kawa.png", name: "皮", n: 3 },
    { icon: "assets/icons/materials/hone.png", name: "骨", n: 1 },
    { icon: "assets/icons/materials/tetsu.png", name: "鉄", n: 2 },
    { rare: true, name: "魂の塊", n: 1 },
  ];
  let memberCount = 3;
  let genToken = 0; // リプレイ連打対策(古いタイマーの演出を無効化)

  function sfx(src, vol) {
    try { const a = new Audio(src); a.volume = vol == null ? 0.5 : vol; a.play().catch(() => {}); } catch (e) {}
  }

  function buildXpList() {
    const list = document.getElementById("xpList");
    list.innerHTML = "";
    MEMBERS.slice(0, memberCount).forEach((m) => {
      const row = document.createElement("div");
      row.className = "xp-row reveal";
      row.innerHTML = `
        <img src="${m.img}" alt="">
        <div class="xp-main">
          <div class="xp-head"><strong>${m.name}(${m.cls})</strong><span>+${m.xp} XP</span></div>
          <div class="xp-lv">Lv.${m.lv}</div>
          <div class="xpbar"><i></i></div>
        </div>`;
      list.appendChild(row);
    });
  }

  function buildMatRow() {
    const row = document.getElementById("matRow");
    row.innerHTML = "";
    MATS.forEach((mt) => {
      const chip = document.createElement("span");
      chip.className = "mat-chip" + (mt.rare ? " rare" : "");
      chip.innerHTML = mt.rare
        ? `<span class="orb">💠</span>${mt.name}×${mt.n}`
        : `<img src="${mt.icon}" alt="">${mt.name}×${mt.n}`;
      row.appendChild(chip);
    });
  }

  function play() {
    const token = ++genToken;
    const alive = () => token === genToken;
    buildXpList();
    buildMatRow();
    const gold = document.getElementById("gold");
    const stats = document.getElementById("stats");
    const xpHeading = document.getElementById("xpHeading");
    const stamp = document.getElementById("stamp");
    [gold, stats, xpHeading].forEach((el) => el.classList.remove("in"));
    stamp.style.opacity = "0";
    stamp.getAnimations().forEach((a) => a.cancel());
    gold.textContent = "収穫: +0G";
    sfx("assets/sfx/result.mp3", 0.45);

    // 1. 収穫ゴールドのカウントアップ(本物のanimateGoldCountと同じ見せ方)
    setTimeout(() => {
      if (!alive()) return;
      gold.classList.add("in");
      const total = 128, dur = 900, t0 = performance.now();
      let lastTick = 0;
      (function step(now) {
        if (!alive()) return;
        const p = Math.min(1, (now - t0) / dur);
        const eased = 1 - Math.pow(1 - p, 2.2);
        gold.textContent = `収穫: +${Math.round(total * eased)}G`;
        if (now - lastTick > 130 && p < 1) { sfx("assets/sfx/coin.ogg", 0.22); lastTick = now; }
        if (p < 1) requestAnimationFrame(step); else gold.textContent = `収穫: +${total}G`;
      })(t0);
    }, 260);

    // 2. ★素材チップが1個ずつポンポンと弾んで並ぶ(ここが提案の追加演出)
    document.querySelectorAll(".mat-chip").forEach((chip, i) => {
      setTimeout(() => {
        if (!alive()) return;
        chip.animate(
          [ { opacity: 0, transform: "scale(0.4) translateY(6px)" },
            { opacity: 1, transform: "scale(1.15)", offset: 0.7 },
            { opacity: 1, transform: "scale(1)" } ],
          { duration: 280, easing: "ease-out", fill: "forwards" });
        sfx("assets/sfx/coin.ogg", 0.3);
        if (chip.classList.contains("rare")) {
          chip.animate(
            [ { boxShadow: "0 0 20px rgba(255,190,60,0.95)" }, { boxShadow: "0 0 8px rgba(255,190,60,0.5)" } ],
            { duration: 800, easing: "ease-out" });
        }
      }, 1250 + i * 170);
    });

    // 3. 戦績行→経験値見出し→各行(バーが伸びる)
    setTimeout(() => { if (alive()) stats.classList.add("in"); }, 2100);
    setTimeout(() => {
      if (!alive()) return;
      xpHeading.classList.add("in");
      document.querySelectorAll(".xp-row").forEach((row, i) => {
        setTimeout(() => {
          if (!alive()) return;
          row.classList.add("in");
          const bar = row.querySelector(".xpbar i");
          const target = 30 + ((i * 23) % 55);
          bar.animate([ { width: "0%" }, { width: target + "%" } ], { duration: 700, easing: "ease-out", fill: "forwards", delay: 220 });
        }, i * 90);
      });
    }, 2300);

    // 4. 朱印
    setTimeout(() => {
      if (!alive()) return;
      stamp.style.opacity = "";
      stamp.animate(
        [ { opacity: 0, transform: "rotate(-3deg) scale(2.1)" },
          { opacity: 1, transform: "rotate(-12deg) scale(0.94)", offset: 0.6 },
          { opacity: 1, transform: "rotate(-12deg) scale(1)" } ],
        { duration: 400, easing: "cubic-bezier(0.3,1.2,0.4,1)", fill: "forwards" });
      sfx("assets/sfx/quest_accept.mp3", 0.5);
    }, 2300 + memberCount * 90 + 1100);
  }

  document.getElementById("btnReplay").addEventListener("click", play);
  document.getElementById("btnMembers").addEventListener("click", (e) => {
    memberCount = memberCount === 3 ? 4 : 3;
    e.target.textContent = memberCount === 3 ? "👥 4人版で確認" : "👥 3人版に戻す";
    play();
  });

  play();
})();
</script>
</body>
</html>
