<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>敵イラスト透過・枠なし戦闘サンプル</title>
<style>
  /* 敵イラストを背景透過(rembg)し、木枠カードを無くした戦闘画面の見た目サンプル(ゲーム本体は未変更)。
     下のボタンで「現行(木枠カード)」⇔「枠なし透過」を切り替えて比較できる */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; background: #14100c; color: #e8e0d0; display: flex; justify-content: center; user-select: none; -webkit-user-select: none; }
  .stage { position: relative; width: 100%; max-width: 480px; height: 100dvh; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: url("assets/bg/forest_day.jpg") center / cover no-repeat #1a1410; }
  .bg::after { content: ''; position: absolute; inset: 0; background:
    radial-gradient(ellipse 230px 150px at 50% 92px, rgba(255,246,222,0.14), rgba(255,246,222,0) 70%),
    linear-gradient(to bottom, rgba(20,24,27,0.2), rgba(20,24,27,0.7) 55%, rgba(20,24,27,0.9)); }

  .enemy-row { position: absolute; top: 0; left: 0; right: 0; z-index: 1; display: flex; justify-content: center; align-items: flex-end; gap: 0.8rem; padding: 38px 0.6rem 10px; height: 186px; }

  /* ---- 現行: 木枠カード(額装) ---- */
  .enemy-card {
    position: relative; text-align: center; border-radius: 12px; padding: 0.4rem;
    border: 2px solid transparent;
    background: linear-gradient(155deg, #6b4a2e 0%, #4a3220 55%, #3a2818 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 3px 10px rgba(0,0,0,0.4);
    width: 108px;
  }
  .enemy-card::before {
    content: ""; position: absolute; inset: 4px; z-index: 0; border-radius: 9px;
    background: radial-gradient(circle at 22% 18%, rgba(255,255,255,0.05), transparent 55%), #3c3527;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
  }
  .enemy-card .ename { position: relative; z-index: 1; font-size: 0.72rem; font-weight: 700; }
  .enemy-card img { position: relative; z-index: 1; width: 100%; aspect-ratio: 1/1; object-fit: contain; display: block; }
  .enemy-card .hpbar { position: relative; z-index: 1; height: 6px; margin-top: 3px; background: rgba(0,0,0,0.55); border-radius: 3px; overflow: hidden; }
  .enemy-card .hpbar i { display: block; height: 100%; background: linear-gradient(to bottom, #6cc26c, #3f9e4e); }

  /* ---- 新案: 枠なし+背景透過(戦場に直接立っている) ---- */
  .enemy-free { position: relative; text-align: center; width: 118px; }
  .enemy-free .ename {
    font-size: 0.74rem; font-weight: 800; color: #f0e6cc;
    text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.6);
    margin-bottom: 1px;
  }
  .enemy-free .body-wrap { position: relative; }
  /* 足元の接地影(楕円)。透過キャラが浮いて見えないように */
  .enemy-free .body-wrap::after {
    content: ""; position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%);
    width: 78%; height: 16px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,0.45), transparent 70%);
    z-index: 0;
  }
  .enemy-free img {
    position: relative; z-index: 1; width: 100%; aspect-ratio: 1/1; object-fit: contain; display: block;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  }
  .enemy-free .hpbar {
    height: 6px; margin: 3px auto 0; width: 84%;
    background: rgba(0,0,0,0.55); border-radius: 3px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .enemy-free .hpbar i { display: block; height: 100%; background: linear-gradient(to bottom, #6cc26c, #3f9e4e); }

  .battle-log {
    position: absolute; left: 8px; right: 8px; top: 210px; height: 84px; z-index: 2;
    border: 2px solid #4b3728; border-radius: 10px;
    outline: 1px solid rgba(217,196,154,0.75); outline-offset: -5px;
    background: rgba(26,20,14,0.9); padding: 10px 12px; font-size: 0.74rem; line-height: 1.5;
    display: flex; flex-direction: column; justify-content: center;
  }
  .party-bar { position: absolute; left: 0; right: 0; top: 320px; display: flex; justify-content: center; gap: 8px; z-index: 1; background: rgba(20,24,27,0.72); padding: 0.7rem 0.6rem; }
  .pcard { width: 92px; border-radius: 10px; padding: 4px; text-align: center; }
  .pcard img { width: 70px; display: block; margin: 0 auto; background: #353a44; border-radius: 8px; }
  .pcard .nm { font-size: 0.68rem; margin-top: 2px; }
  .pcard .bar { height: 5px; border-radius: 2px; overflow: hidden; background: rgba(0,0,0,0.5); margin-top: 3px; }
  .pcard .bar i { display: block; height: 100%; width: 85%; background: #5fae6e; }
  .actions { position: absolute; left: 10px; right: 10px; top: 500px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; z-index: 2; }
  .actions button {
    font-family: inherit; font-size: 0.95rem; font-weight: 900; color: #e8e0d0;
    background: linear-gradient(155deg, #3a3226 0%, #241d14 100%); border: 1px solid rgba(217,196,154,0.4);
    border-radius: 12px; padding: 13px 4px;
  }
  .actions button.primary { color: #241a0c; background: linear-gradient(160deg, #e0c078, #b8924a); }

  .mode-btn {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 10; font-family: inherit; font-size: 0.82rem; font-weight: 800; color: #f0e0b0;
    background: rgba(20,26,32,0.95); border: 1px solid rgba(240,200,120,0.7); border-radius: 12px; padding: 12px 20px;
  }
  .mock-note { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 10; font-size: 0.6rem; color: rgba(232,224,208,0.6); background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 10px; white-space: nowrap; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg"></div>
  <div class="enemy-row" id="enemyRow"></div>
  <div class="battle-log"><p>かまいたち、猪、大蜘蛛が現れた！</p></div>
  <div class="party-bar">
    <div class="pcard"><img src="assets/class_samurai.png"><div class="nm">小太郎</div><div class="bar"><i></i></div></div>
    <div class="pcard"><img src="assets/class_hunter.png"><div class="nm">弥助</div><div class="bar"><i></i></div></div>
    <div class="pcard"><img src="assets/class_onmyoji.png"><div class="nm">静</div><div class="bar"><i></i></div></div>
  </div>
  <div class="actions">
    <button class="primary">攻撃</button><button>技</button><button>道具</button><button>逃げる</button>
  </div>
  <div class="mock-note">敵イラスト透過・枠なしサンプル(本体は未変更)</div>
  <button class="mode-btn" id="modeBtn"></button>
</div>

<script>
(() => {
  const ENEMIES = [
    { name: "かまいたち", card: "assets/enemies/kamaitachi.png", cut: "assets/mock/kamaitachi_cut.png", hp: 100 },
    { name: "猪", card: "assets/enemies/inoshishi.png", cut: "assets/mock/inoshishi_cut.png", hp: 78 },
    { name: "大蜘蛛", card: "assets/enemies/oogumo.png", cut: "assets/mock/oogumo_cut.png", hp: 55 },
  ];
  let mode = "free"; // "card"=現行(木枠) / "free"=枠なし透過
  function render() {
    document.getElementById("enemyRow").innerHTML = ENEMIES.map((e) => mode === "card" ? `
      <div class="enemy-card">
        <div class="ename">${e.name}</div>
        <img src="${e.card}">
        <div class="hpbar"><i style="width:${e.hp}%"></i></div>
      </div>` : `
      <div class="enemy-free">
        <div class="ename">${e.name}</div>
        <div class="body-wrap"><img src="${e.cut}"></div>
        <div class="hpbar"><i style="width:${e.hp}%"></i></div>
      </div>`).join("");
    document.getElementById("modeBtn").textContent = mode === "card" ? "→ 枠なし透過に切り替え" : "→ 現行(木枠カード)に切り替え";
  }
  document.getElementById("modeBtn").onclick = () => { mode = mode === "card" ? "free" : "card"; render(); };
  render();
})();
</script>
</body>
</html>
