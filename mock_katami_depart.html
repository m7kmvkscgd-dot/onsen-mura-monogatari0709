<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>モック: 出発タブの形見選択(案B改)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #14181b; color: #ece8dc; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  button { touch-action: manipulation; font-family: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0.8rem 0.9rem 3rem; }

  h1 { font-size: 1.1rem; margin: 0.2rem 0 0.8rem; }
  h2 { font-size: 1rem; margin: 1rem 0 0.3rem; }
  .caption { font-size: 13px; color: #9aa0a8; margin: 0 0 0.5rem; }
  .dim-note { font-size: 12px; color: #6f7680; text-align: center; padding: 0.5rem 0; border: 1px dashed #3a4048; border-radius: 8px; margin: 0.4rem 0; }
  hr.divider { border: none; border-top: 1px solid #2e343d; margin: 1rem 0; }

  /* ---- 形見: アイコンのみのチップを1行・横スクロール ---- */
  .katami-chip-bar {
    display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.3rem;
    -webkit-overflow-scrolling: touch;
    /* 端が切れて見える=まだ右にあるという手がかりを消さないため、scrollbarは非表示でも余白は残す */
    scrollbar-width: none;
  }
  .katami-chip-bar::-webkit-scrollbar { display: none; }
  .katami-chip {
    flex: 0 0 auto; width: 56px; height: 56px;
    background: #232830; border: 2px solid #3a4048; border-radius: 10px;
    color: #ece8dc; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0;
  }
  .katami-chip .icon { font-size: 1.6rem; line-height: 1; }
  .katami-chip.selected { border-color: #d7b66f; background: #2a2620; box-shadow: 0 0 8px rgba(215,182,111,0.35); }
  .katami-chip.cooldown { opacity: 0.4; }
  .katami-chip .cd { font-size: 9px; color: #e08a8a; line-height: 1.2; margin-top: 1px; }
  .katami-effect-line { font-size: 12px; color: #b7a875; margin: 0.35rem 0 0; line-height: 1.5; min-height: 1.2em; }
  .katami-effect-line .cd-note { color: #9aa0a8; }

  /* 出発ボタン(本体の簡易再現) */
  .depart-btn {
    width: 100%; padding: 0.85rem 0; border-radius: 10px; border: none;
    background: linear-gradient(155deg, #7a5c2e, #5d431e); color: #f5efdd;
    font-size: 1.05rem; font-weight: 800; margin-top: 0.4rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>モック: 出発タブの形見選択(案B改)</h1>

  <div class="dim-note">…(支援物資: 回復薬/煙玉/野営具の購入カード)…</div>

  <!-- ============ 形見セクション(ここが新設部分) ============ -->
  <h2>🎐 形見 <span class="caption" style="font-size:12px;">1つだけ持っていけます</span></h2>
  <div class="katami-chip-bar" id="chipBar"></div>
  <p class="katami-effect-line" id="chipEffect"></p>

  <hr class="divider">
  <div class="dim-note">…(出発メンバーを選ぶ: キャラ一覧)…</div>
  <button class="depart-btn">深淵の森へ出発する</button>
</div>

<script>
// 所持形見のサンプル。横スクロール確認用に多め。cdDays=その形見固有のクールダウン日数(仕様)、
// cdLeft=いま冷却中の残り日数(0=使用可)。鏡片と狐面を冷却中にして見え方を確認する
// 「持って行かない」ボタンは廃止: 選択中の形見をもう一度タップすると解除(ユーザー指定)
const KATAMI = [
  { id: "akao",     icon: "🎗️", name: "花婿の赤緒",   effect: "敵1体を組紐で縛り上げる", cdDays: 2, cdLeft: 0 },
  { id: "kagami",   icon: "🪞", name: "逆月の鏡片",   effect: "次の被弾1回を影が身代わりで受ける", cdDays: 3, cdLeft: 2 },
  { id: "yunohana", icon: "🧴", name: "湯の花の小瓶", effect: "味方1人のHPを癒やし、炎上と毒を洗い流す", cdDays: 1, cdLeft: 0 },
  { id: "kitsune",  icon: "🦊", name: "うつろの狐面", effect: "その戦闘の間、通常攻撃が2回攻撃になる", cdDays: 3, cdLeft: 1 },
  { id: "kotsurin", icon: "🔔", name: "骨鈴のお守り", effect: "骸骨を1体呼び出して盾にする", cdDays: 1, cdLeft: 0 },
  { id: "suzu",     icon: "🛎️", name: "白縫の銀鈴",   effect: "味方全員がその場で防御の構えを取る", cdDays: 2, cdLeft: 0 },
];
let selected = "akao";

function pick(id) {
  const k = KATAMI.find((x) => x.id === id);
  if (k.cdLeft > 0) return; // クールダウン中は選べない
  selected = selected === id ? null : id; // 選択中をもう一度タップ=解除
  render();
}
function render() {
  document.getElementById("chipBar").innerHTML = KATAMI.map((k) => `
    <button class="katami-chip ${k.id === selected ? "selected" : ""} ${k.cdLeft > 0 ? "cooldown" : ""}" onclick="pick('${k.id}')">
      <span class="icon">${k.icon}</span>
      ${k.cdLeft > 0 ? `<span class="cd">あと${k.cdLeft}日</span>` : ""}
    </button>`).join("");
  const sel = KATAMI.find((x) => x.id === selected);
  document.getElementById("chipEffect").innerHTML = sel
    ? `<strong>${sel.name}</strong>: ${sel.effect} <span class="cd-note">(クールダウン${sel.cdDays}日)</span>`
    : "形見を持たずに出発する";
}
render();
</script>
</body>
</html>
