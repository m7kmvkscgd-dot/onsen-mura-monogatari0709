<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>襲撃カウントダウンモック</title>
<style>
  /* 襲撃カウントダウン表示のモック(ゲーム本体には未実装)。
     ①町画面: 日付の横に「襲撃まで◯日」バッジ ②出発準備画面: 出発ボタンの直上に同じバッジ
     残り日数で色が段階変化(3日以上=通常/2日=黄/1日=赤+点滅/当日=出発ボタンが襲撃戦に変化) */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; background: #14100c; color: #e8e0d0; display: flex; justify-content: center; user-select: none; -webkit-user-select: none; }
  .wrap { position: relative; width: 100%; max-width: 480px; min-height: 100dvh; padding-bottom: 90px; }

  .section-label { font-size: 0.7rem; color: rgba(232,224,208,0.55); padding: 10px 12px 4px; }

  /* ---- 町画面のヘッダー再現 ---- */
  .town-hero { position: relative; height: 210px; background: url("assets/bg/town.jpg") center 35% / cover no-repeat; overflow: hidden; }
  .town-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(16,12,8,0.15), rgba(20,16,12,0.55) 70%, #14100c); }
  .town-hero-inner { position: relative; z-index: 2; padding-top: 26px; text-align: center; }
  .date-row { display: flex; justify-content: center; align-items: center; gap: 8px; }
  .tod-label { font-size: 0.8rem; color: #e8dcbf; text-shadow: 0 1px 3px rgba(0,0,0,0.9); background: rgba(0,0,0,0.35); border-radius: 12px; padding: 2px 10px; }
  .town-hero h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.2em; color: #f0e6cc; text-shadow: 0 2px 8px rgba(0,0,0,0.9); margin-top: 6px; }

  /* ---- 襲撃カウントダウンバッジ(本命のUI) ---- */
  .raid-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.8rem; font-weight: 800; color: #e8dcbf;
    background: rgba(30,22,14,0.85); border: 1px solid rgba(180,120,90,0.55); border-radius: 12px;
    padding: 2px 10px; text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }
  .raid-badge.warn { color: #f2d94e; border-color: rgba(242,217,78,0.7); }
  .raid-badge.danger { color: #ff6b5a; border-color: rgba(255,107,90,0.8); animation: raidPulse 1.1s ease-in-out infinite; }
  .raid-badge.today { color: #fff; background: rgba(160,36,26,0.9); border-color: rgba(255,150,130,0.9); animation: raidPulse 0.8s ease-in-out infinite; }
  @keyframes raidPulse {
    0%, 100% { box-shadow: 0 0 4px rgba(255,90,70,0.3); }
    50% { box-shadow: 0 0 12px rgba(255,90,70,0.85); }
  }

  /* ---- 出発準備画面の再現 ---- */
  .prep { padding: 12px; }
  .prep h2 { font-size: 1rem; color: #e8dcbf; margin-bottom: 8px; }
  .member-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .mcard { width: 70px; border-radius: 10px; padding: 4px; text-align: center; background: rgba(38,46,52,0.9); border: 1px solid rgba(255,255,255,0.14); }
  .mcard img { width: 48px; display: block; margin: 0 auto; }
  .mcard .nm { font-size: 0.6rem; }
  .depart-zone { margin-top: 6px; }
  .depart-zone .raid-badge { margin-bottom: 8px; }
  .depart-btn {
    display: block; width: 100%; padding: 15px; border-radius: 12px;
    font-family: inherit; font-size: 1rem; font-weight: 900; color: #241a0c;
    background: linear-gradient(160deg, #e0c078, #b8924a); border: 1px solid rgba(255,240,200,0.5);
  }
  .depart-btn .sub { display: block; font-size: 0.68rem; font-weight: 700; opacity: 0.8; margin-top: 2px; }
  .depart-btn.raid-today {
    color: #fff; background: linear-gradient(160deg, #b83a2c, #7e2318); border-color: rgba(255,150,130,0.7);
    animation: raidPulse 0.8s ease-in-out infinite;
  }

  .controls { position: fixed; left: 50%; transform: translateX(-50%); bottom: 10px; z-index: 10; display: flex; gap: 8px; width: calc(100% - 24px); max-width: 456px; }
  .controls button { flex: 1; font-family: inherit; font-size: 0.85rem; font-weight: 700; color: #e8e0d0; background: rgba(20,26,32,0.95); border: 1px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 12px 4px; }
  .controls button:active { transform: scale(0.96); }
  .mock-note { position: fixed; left: 50%; transform: translateX(-50%); bottom: 64px; font-size: 0.6rem; color: rgba(232,224,208,0.6); background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 10px; white-space: nowrap; z-index: 10; }
</style>
</head>
<body>
<div class="wrap">
  <div class="section-label">① 町画面(日付の横に常設)</div>
  <div class="town-hero">
    <div class="town-hero-inner">
      <div class="date-row">
        <span class="tod-label" id="dateLabel">4月12日</span>
        <span class="raid-badge" id="raidBadgeTown"></span>
      </div>
      <h1>湯乃里温泉</h1>
      <div class="date-row" style="margin-top:0.2rem;">
        <span class="tod-label">昼 12:30</span>
      </div>
    </div>
  </div>

  <div class="section-label">② 出発準備画面(出発ボタンの直上)</div>
  <div class="prep">
    <h2>出発メンバー</h2>
    <div class="member-row">
      <div class="mcard"><img src="assets/class_samurai.png"><div class="nm">小太郎</div></div>
      <div class="mcard"><img src="assets/class_hunter.png"><div class="nm">弥助</div></div>
      <div class="mcard"><img src="assets/class_onmyoji.png"><div class="nm">静</div></div>
      <div class="mcard"><img src="assets/class_spearman.png"><div class="nm">権六</div></div>
    </div>
    <div class="depart-zone">
      <span class="raid-badge" id="raidBadgePrep"></span>
      <button class="depart-btn" id="departBtn"></button>
    </div>
  </div>

  <div class="mock-note">襲撃カウントダウンモック(本体には未実装)</div>
  <div class="controls">
    <button id="btnPrev">◀ 前日に戻す</button>
    <button id="btnNext">1日進める ▶</button>
  </div>
</div>

<script>
(() => {
  // 残り日数 → バッジ/ボタンの見た目(5日から当日まで巡回)
  let daysLeft = 3;
  const badges = [document.getElementById("raidBadgeTown"), document.getElementById("raidBadgePrep")];
  const departBtn = document.getElementById("departBtn");
  const dateLabel = document.getElementById("dateLabel");
  const BASE_DAY = 12; // 4月12日起点(表示用)

  function render() {
    const cls = daysLeft <= 0 ? "today" : daysLeft === 1 ? "danger" : daysLeft === 2 ? "warn" : "";
    const text = daysLeft <= 0 ? "👹 襲撃当日！" : `👹 襲撃まで${daysLeft}日`;
    badges.forEach((b) => { b.className = "raid-badge" + (cls ? " " + cls : ""); b.textContent = text; });
    dateLabel.textContent = `4月${BASE_DAY + (3 - daysLeft)}日`;
    if (daysLeft <= 0) {
      departBtn.className = "depart-btn raid-today";
      departBtn.innerHTML = '村を守る(襲撃戦へ)<span class="sub">今日は遠征に出られない</span>';
    } else {
      departBtn.className = "depart-btn";
      departBtn.innerHTML = '深淵の森へ出発する<span class="sub">最高到達: 15層</span>';
    }
  }
  document.getElementById("btnNext").onclick = () => { daysLeft = Math.max(0, daysLeft - 1); render(); };
  document.getElementById("btnPrev").onclick = () => { daysLeft = Math.min(5, daysLeft + 1); render(); };
  render();
})();
</script>
</body>
</html>
