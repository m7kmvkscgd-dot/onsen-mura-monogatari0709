<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>モック: ボスの存在感(サイズ・配置)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #14181b; color: #ece8dc; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  button { touch-action: manipulation; font-family: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; }

  .scene { position: sticky; top: 0; z-index: 10; height: 470px; overflow: hidden;
    background-image: url('assets/bg/suzunari_gake.jpg'); background-size: cover; background-position: center 30%;
    box-shadow: 0 6px 14px rgba(0,0,0,0.6); }
  .scene::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(20,24,27,0.12), rgba(20,24,27,0.5) 62%, rgba(20,24,27,0.78)); }
  .logbox { position: absolute; top: 8px; left: 12px; right: 12px; z-index: 3;
    border: 2px solid #8a7448; border-radius: 10px; background: rgba(16,13,10,0.82);
    min-height: 44px; padding: 6px 10px; font-size: 0.72rem; color: #d9cfb8; }
  .enemy-row { position: absolute; top: 70px; left: 0; right: 0; bottom: 148px; z-index: 2;
    display: flex; justify-content: center; align-items: flex-end; gap: 6px; }
  .ecard { text-align: center; position: relative; }
  .ecard img { display: block; margin: 0 auto; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.5)); }
  .ecard .shadow { height: 12px; margin: -6px auto 0; width: 66%; border-radius: 50%;
    background: radial-gradient(ellipse 50% 50% at center, rgba(8,6,4,0.42), rgba(8,6,4,0.22) 55%, transparent 72%); }
  .ecard .nm { font-size: 0.74rem; font-weight: 700; text-shadow: 0 1px 3px #000; }
  .ecard.boss .nm { font-size: 0.9rem; letter-spacing: 0.06em; }
  .ecard .hp { height: 9px; border-radius: 99px; background: #3a3a3a; margin: 4px auto 0; overflow: hidden; border: 1px solid rgba(0,0,0,0.7); max-width: 180px; }
  .ecard.boss .hp { height: 12px; border: 1px solid rgba(228,192,107,0.55); }
  .ecard .hp i { display: block; height: 100%; width: 88%; background: #4caf6f; }
  /* 案C: 奥行き配置(雑魚を手前・下寄りに小さく、ボスは奥で大きい) */
  .enemy-row.depth .ecard.mob { margin-bottom: -18px; z-index: 3; }
  .enemy-row.depth .ecard.boss { z-index: 2; margin-left: -26px; margin-right: -26px; }
  .allies { position: absolute; left: 0; right: 0; bottom: 12px; z-index: 4; display: flex; justify-content: center; gap: 8px; }
  .ally { width: 88px; background: rgba(30,34,40,0.85); border: 1px solid #3a4048; border-radius: 10px; padding: 5px; text-align: center; transition: width 0.3s; }
  .allies.shrunk .ally { width: 70px; }
  .allies.shrunk .ally .nm { font-size: 0.6rem; }
  .ally img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #353a44; border-radius: 6px; }
  .ally .nm { font-size: 0.66rem; font-weight: 700; }

  .panel { padding: 0.7rem 0.9rem 3rem; }
  .panel h2 { font-size: 0.9rem; margin: 0.8rem 0 0.3rem; }
  .row2 { display: flex; gap: 0.4rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
  .row2 button { flex: 1; min-width: 30%; padding: 0.55rem 0; border-radius: 9px; border: 1px solid #4a505a; background: #232830; color: #ece8dc; font-size: 0.78rem; font-weight: 700; }
  .row2 button.on { border-color: #d7b66f; background: #3a3020; color: #f0e2b8; }
  .panel p.note { font-size: 11px; color: #9aa79f; margin: 0.2rem 0 0.6rem; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="scene">
    <div class="logbox">お鈴が銀の鈴を鳴らした。赤い組紐が、静かに獲物を探し始める…！</div>
    <div class="enemy-row" id="erow"></div>
    <div class="allies">
      <div class="ally"><img src="assets/class_samurai.png"><div class="nm">権兵衛</div></div>
      <div class="ally"><img src="assets/class_hunter.png"><div class="nm">小夜</div></div>
      <div class="ally"><img src="assets/class_onmyoji.png"><div class="nm">晴明</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>ボスの大きさ(立ち絵の高さ)</h2>
    <div class="row2">
      <button data-size="130" onclick="setSize(this)">現行くらい(130px)</button>
      <button data-size="180" onclick="setSize(this)">大(180px)</button>
      <button data-size="220" class="on" onclick="setSize(this)">特大(220px)</button>
      <button data-size="260" onclick="setSize(this)">襲撃級(260px)</button>
    </div>
    <h2>取り巻きと配置</h2>
    <div class="row2">
      <button id="mobBtn" class="on" onclick="toggleMobs(this)">提灯童2体: あり</button>
      <button id="depthBtn" onclick="toggleDepth(this)">奥行き配置: OFF</button>
      <button id="shrinkBtn" onclick="toggleShrink(this)">味方/雑魚を相対縮小: OFF</button>
    </div>
    <p class="note">「相対縮小」= ボス戦専用に味方カードを70px(5人編成サイズ相当)へ、雑魚も一回り小さく。ボスをただ大きくするのではなく周りを縮めて画面の圧迫を防ぐ案。「奥行き配置」= 雑魚を一段手前(下寄り)に小さく重ね、ボスは奥で大きく構える。行列の遠近感が出て、幅もその分節約できる。名前とHPバーもボスだけ太く・大きくしてある。</p>
  </div>
</div>

<script>
let bossSize = 220, mobs = true, depth = false, shrunk = false;
function render() {
  const row = document.getElementById("erow");
  row.classList.toggle("depth", depth);
  document.querySelector(".allies").classList.toggle("shrunk", shrunk);
  const mobH = (depth ? 84 : 96) - (shrunk ? 14 : 0);
  const mob = `<div class="ecard mob"><img style="height:${mobH}px" src="assets/enemies/clear/chochin_warabe.png"><div class="shadow"></div><div class="nm">提灯童</div><div class="hp"><i></i></div></div>`;
  row.innerHTML = `${mobs ? mob : ""}
    <div class="ecard boss"><img style="height:${bossSize}px" src="assets/enemies/amayome_shiranui.png"><div class="shadow"></div><div class="nm">鈴鳴の花嫁・お鈴</div><div class="hp" style="width:${Math.min(200, bossSize * 0.85)}px"><i></i></div></div>
    ${mobs ? mob : ""}`;
}
function setSize(btn) {
  bossSize = Number(btn.dataset.size);
  document.querySelectorAll("[data-size]").forEach((b) => b.classList.toggle("on", b === btn));
  render();
}
function toggleMobs(btn) {
  mobs = !mobs;
  btn.textContent = `提灯童2体: ${mobs ? "あり" : "なし"}`;
  btn.classList.toggle("on", mobs);
  render();
}
function toggleShrink(btn) {
  shrunk = !shrunk;
  btn.textContent = `味方/雑魚を相対縮小: ${shrunk ? "ON" : "OFF"}`;
  btn.classList.toggle("on", shrunk);
  render();
}
function toggleDepth(btn) {
  depth = !depth;
  btn.textContent = `奥行き配置: ${depth ? "ON" : "OFF"}`;
  btn.classList.toggle("on", depth);
  render();
}
render();
</script>
</body>
</html>
