<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>投石器演出モック</title>
<style>
  /* 投石器(新施設)の自動攻撃演出モック(ゲーム本体には未実装)。
     実際の大規模戦のレイアウト(敵カード縮小・バリケード・ログ・味方バー)を再現し、
     ①ラウンド終了時に村(画面下方)から石が放物線を描いて地上の敵1体へ着弾する演出
     ②飛行ユニットには当たらない(対象から除外)③敵が全員飛行の時は不発、を確認する。
     ダメージ計算も本体と同じ式(rollBasicAttack+mitigation、村レベル=槍士の同レベル攻撃力)で
     ライブ計算しているので、村レベルを変えて威力感も一緒に確認できる */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; background: #14100c; color: #e8e0d0; display: flex; justify-content: center; user-select: none; -webkit-user-select: none; }
  .stage { position: relative; width: 100%; max-width: 480px; height: 100dvh; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: url("assets/bg/departure_gate_asa.jpg") center / cover no-repeat #1a1410; }
  .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(20,24,27,0.2), rgba(20,24,27,0.7) 55%, rgba(20,24,27,0.9)); }

  .mock-note { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font-size: 0.64rem; color: rgba(232,224,208,0.75); background: rgba(0,0,0,0.4); padding: 2px 10px; border-radius: 10px; z-index: 20; white-space: nowrap; }

  .enemy-row { position: absolute; top: 0; left: 0; right: 0; z-index: 1; display: flex; justify-content: center; gap: 3px; padding: 38px 0.4rem 10px; }
  .enemy-card {
    position: relative; text-align: center; border-radius: 10px; padding: 0.25rem;
    flex: 1 1 0; min-width: 0; max-width: 78px;
    border: 2px solid transparent;
    background: linear-gradient(155deg, #6b4a2e 0%, #4a3220 55%, #3a2818 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 3px 10px rgba(0,0,0,0.4);
    transition: opacity 0.3s, transform 0.3s;
  }
  .enemy-card.dead { opacity: 0; transform: scale(0.85) translateY(6px); pointer-events: none; }
  .enemy-card.excluded { opacity: 0.4; }
  .enemy-card .ename { font-size: 0.6rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .enemy-card img { width: 100%; max-width: 60px; aspect-ratio: 1/1; object-fit: contain; display: block; margin: 0 auto; }
  .enemy-card .hpbar { height: 5px; margin-top: 3px; background: rgba(0,0,0,0.55); border-radius: 3px; overflow: hidden; }
  .enemy-card .hpbar i { display: block; height: 100%; background: linear-gradient(to bottom, #6cc26c, #3f9e4e); transition: width 0.3s ease-out; }
  .flying-badge {
    position: absolute; top: 2px; left: 2px; font-size: 15px; z-index: 2;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
  }
  .target-ring {
    position: absolute; inset: -3px; border-radius: 12px; z-index: 3; pointer-events: none;
    box-shadow: 0 0 0 2px rgba(255,214,102,0.95), 0 0 12px rgba(255,190,60,0.6); opacity: 0;
  }

  /* バリケード(本実装と同じtop:137px・全幅、雰囲気だけ) */
  #barricadeWrap { position: absolute; left: 0; right: 0; top: 137px; z-index: 1; pointer-events: none; opacity: 0.92; }
  #barricadeImg { display: block; width: 100%; height: auto; }

  .battle-log {
    position: absolute; left: 8px; right: 8px; top: 240px; height: 84px; z-index: 5;
    border: 2px solid #4b3728; border-radius: 10px;
    outline: 1px solid rgba(217,196,154,0.75); outline-offset: -5px;
    background: rgba(26,20,14,0.9); padding: 10px 12px; font-size: 0.72rem; line-height: 1.5;
    overflow: hidden;
  }
  .battle-log .dim { opacity: 0.55; }
  .party-bar { position: absolute; left: 0; right: 0; top: 358px; display: flex; justify-content: center; gap: 8px; z-index: 1; }
  .pcard { width: 76px; border-radius: 10px; padding: 4px; text-align: center; background: linear-gradient(160deg, rgba(38,46,52,0.92), rgba(24,30,36,0.92)); border: 1px solid rgba(255,255,255,0.14); }
  .pcard img { width: 52px; display: block; margin: 0 auto; }
  .pcard .bar { height: 4px; border-radius: 2px; overflow: hidden; background: rgba(0,0,0,0.5); margin-top: 2px; }
  .pcard .bar i { display: block; height: 100%; width: 85%; background: #5fae6e; }

  /* 投石器本体(村の奥=画面下方に据えてある想定)。石はここから放たれる */
  .catapult-emplacement {
    position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%); z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none;
  }
  .catapult-emplacement img { width: 70px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
  .catapult-emplacement .clabel { font-size: 0.58rem; color: rgba(232,224,208,0.7); background: rgba(0,0,0,0.4); padding: 1px 6px; border-radius: 8px; }
  .catapult-emplacement.armed img { animation: catapultIdle 2.2s ease-in-out infinite; }
  @keyframes catapultIdle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .catapult-emplacement.fired img { animation: catapultKick 0.45s ease-out; }
  @keyframes catapultKick {
    0% { transform: rotate(0deg) translateY(0); }
    18% { transform: rotate(-14deg) translateY(3px); }
    45% { transform: rotate(6deg) translateY(-2px); }
    70% { transform: rotate(-2deg) translateY(0); }
    100% { transform: rotate(0deg) translateY(0); }
  }

  /* 石(放物線飛翔) */
  .stone-fly { position: absolute; z-index: 15; pointer-events: none; will-change: transform; }
  .stone-fly img { width: 34px; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.7)); }
  .stone-fly.spin img { animation: stoneSpin 0.35s linear infinite; }
  @keyframes stoneSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .stone-shadow {
    position: absolute; z-index: 3; width: 30px; height: 9px; border-radius: 50%;
    background: rgba(0,0,0,0.45); filter: blur(1px); pointer-events: none;
  }
  .impact-burst { position: absolute; z-index: 14; pointer-events: none; }
  .dust { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle, rgba(220,205,175,0.95), rgba(160,140,110,0)); pointer-events: none; z-index: 14; }
  .dmg-pop {
    position: absolute; z-index: 16; pointer-events: none; font-size: 0.95rem; font-weight: 900;
    color: #ffdca0; text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(255,150,60,0.5);
  }
  .miss-pop {
    position: absolute; z-index: 16; pointer-events: none; font-size: 0.72rem; font-weight: 800;
    color: rgba(232,224,208,0.85); text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }

  .settings-strip {
    position: absolute; left: 8px; right: 8px; bottom: 178px; z-index: 10;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 0.72rem; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 6px 10px;
  }
  .settings-strip input[type="number"] { width: 44px; font-size: 0.78rem; padding: 3px 4px; border-radius: 6px; border: 1px solid rgba(217,196,154,0.5); background: rgba(0,0,0,0.35); color: #e8e0d0; text-align: center; }
  .settings-strip .dmg-preview { color: #ffdca0; font-weight: 800; }

  .controls { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .controls button { font-family: inherit; font-size: 0.78rem; font-weight: 700; color: #e8e0d0; background: linear-gradient(160deg, #3a4750, #26313a); border: 1px solid rgba(255,255,255,0.22); border-radius: 9px; padding: 11px 4px; }
  .controls button:active { transform: scale(0.96); }
  .controls button.wide { grid-column: span 2; background: linear-gradient(160deg, #6b4a2e, #4a3220); }
  .controls button.reset { grid-column: span 2; padding: 7px 4px; font-size: 0.68rem; opacity: 0.8; background: transparent; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg"></div>
  <div class="mock-note">投石器 演出モック(本体には未実装)</div>

  <div class="enemy-row" id="enemyRow"></div>

  <div id="barricadeWrap"><img id="barricadeImg" src="assets/battle_barricade.png" alt=""></div>

  <div class="catapult-emplacement armed" id="catapult">
    <img src="assets/icons/buildings/catapult.png" alt="">
    <div class="clabel">投石器</div>
  </div>

  <div class="battle-log" id="log"><div class="dim">襲撃日の朝。村の防衛戦が始まった。</div></div>
  <div class="party-bar" id="partyBar"></div>

  <div class="settings-strip">
    <label>村レベル<input type="number" id="villageLv" min="1" max="7" value="4"></label>
    <span>威力目安: <span class="dmg-preview" id="dmgPreview">-</span></span>
  </div>

  <div class="controls">
    <button class="wide" id="btnRoundEnd">🪨 ラウンド終了(投石発動)</button>
    <button id="btnToggleFly">飛行ユニットに切替</button>
    <button id="btnAllFly">敵を全員飛行にする</button>
    <button class="reset" id="btnReset">リセット</button>
  </div>
</div>

<script>
(() => {
  // SE(本体playSfxと同じ事前デコード+WebAudio方式)
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  const AC = window.AudioContext || window.webkitAudioContext;
  const sfxCtx = AC ? new AC() : null;
  const sfxBuffers = {};
  ["assets/sfx/barricade_hit.mp3", "assets/sfx/hit_taken_2.mp3"].forEach((url) => {
    if (!sfxCtx) return;
    fetch(url).then((r) => r.arrayBuffer()).then((d) => sfxCtx.decodeAudioData(d)).then((b) => { sfxBuffers[url] = b; }).catch(() => {});
  });
  function sfx(src, vol) {
    if (!sfxCtx || !sfxBuffers[src]) return;
    const start = () => {
      const s = sfxCtx.createBufferSource();
      s.buffer = sfxBuffers[src];
      const g = sfxCtx.createGain();
      g.gain.value = vol == null ? 0.5 : vol;
      s.connect(g).connect(sfxCtx.destination);
      s.start(0);
    };
    if (sfxCtx.state !== "running") sfxCtx.resume().then(start).catch(() => {});
    else start();
  }
  document.addEventListener("touchend", () => { if (sfxCtx && sfxCtx.state !== "running") sfxCtx.resume().catch(() => {}); }, { passive: true });

  // ---- 本体と同じダメージ式(engine.jsのrollBasicAttack/mitigation/levelUp成長式をそのまま再現) ----
  // 「村レベル=槍士の同レベル攻撃力」として計算する(ユーザー指定の仕様)
  const SPEARMAN_BASE_ATK = 11;
  function mitigation(def, K) {
    const defPierce = 1 - 18 / K;
    const reduction = Math.min(0.9, Math.max(0, Math.max(0, def) / 100 * (1 - defPierce)));
    return 1 - reduction;
  }
  function catapultAtk(villageLv) {
    const growth = 1 + (Math.max(1, villageLv) - 1) * 0.075;
    return Math.round(SPEARMAN_BASE_ATK * growth);
  }
  function rollCatapultDamage(villageLv, def) {
    const atk = catapultAtk(villageLv);
    const mult = 1 + (Math.random() * 2 - 1) * 0.15; // rollBasicAttackと同じ±15%
    return Math.max(1, Math.round(atk * mitigation(def, 18) * mult));
  }

  // ---- 敵データ(ダミー、defは本体の代表値に近い数値) ----
  const ENEMY_TEMPLATES = [
    { id: "inoshishi", ja: "猪", img: "assets/enemies/inoshishi.png", def: 15, maxHp: 62 },
    { id: "oogumo", ja: "大蜘蛛", img: "assets/enemies/oogumo.png", def: 12, maxHp: 70 },
    { id: "dai_tengu", ja: "大天狗", img: "assets/enemies/dai_tengu.png", def: 28, maxHp: 140 },
    { id: "karasu_tengu", ja: "烏天狗", img: "assets/enemies/karasu_tengu.png", def: 15, maxHp: 164, isFlying: true },
    { id: "inoshishi2", ja: "猪", img: "assets/enemies/inoshishi.png", def: 15, maxHp: 62 },
  ];

  const stage = document.getElementById("stage");
  const enemyRow = document.getElementById("enemyRow");
  const logEl = document.getElementById("log");
  const catapultEl = document.getElementById("catapult");
  const villageLvInput = document.getElementById("villageLv");
  const dmgPreview = document.getElementById("dmgPreview");
  let enemies = [];
  let busy = false;

  function addLog(t) {
    const d = document.createElement("div");
    d.textContent = t;
    logEl.appendChild(d);
    while (logEl.children.length > 3) logEl.removeChild(logEl.firstChild);
  }
  function stageRect() { return stage.getBoundingClientRect(); }
  function centerOf(el) {
    const r = el.getBoundingClientRect(), s = stageRect();
    return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
  }

  function renderEnemies() {
    enemyRow.innerHTML = "";
    enemies.forEach((e) => {
      const card = document.createElement("div");
      card.className = "enemy-card" + (e.hp <= 0 ? " dead" : "") + (e.isFlying ? " excluded" : "");
      card.dataset.id = e.uid;
      card.innerHTML = `
        ${e.isFlying ? '<span class="flying-badge">🪽</span>' : ""}
        <div class="target-ring"></div>
        <div class="ename">${e.ja}</div>
        <img src="${e.img}" alt="">
        <div class="hpbar"><i style="width:${Math.max(0, e.hp / e.maxHp * 100)}%"></i></div>
      `;
      enemyRow.appendChild(card);
    });
  }

  function updatePreview() {
    const lv = Math.min(7, Math.max(1, Number(villageLvInput.value) || 1));
    const atk = catapultAtk(lv);
    const sample = Math.round(atk * mitigation(15, 18));
    dmgPreview.textContent = `槍士Lv${lv}相当(atk${atk}) / 対def15で約${sample}`;
  }
  villageLvInput.addEventListener("input", updatePreview);

  function resetScene() {
    enemies = ENEMY_TEMPLATES.map((t, i) => Object.assign({}, t, { uid: "e" + i, hp: t.maxHp }));
    renderEnemies();
    catapultEl.classList.remove("fired");
    catapultEl.classList.add("armed");
    logEl.innerHTML = "";
    addLog("襲撃日の朝。村の防衛戦が始まった。");
    updatePreview();
    busy = false;
  }

  const P = [["spearman"], ["hunter"], ["naginata"]];
  document.getElementById("partyBar").innerHTML = P.map(([c]) =>
    `<div class="pcard"><img src="assets/class_${c}.png"><div class="bar"><i></i></div></div>`).join("");

  function spawnDust(x, y, n) {
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      d.className = "dust";
      d.style.left = (x - 4) + "px"; d.style.top = (y - 4) + "px";
      stage.appendChild(d);
      const dx = (Math.random() - 0.5) * 46, dy = -8 - Math.random() * 26;
      d.animate(
        [{ opacity: 0.9, transform: "translate(0,0) scale(1)" }, { opacity: 0, transform: `translate(${dx}px,${dy}px) scale(1.8)` }],
        { duration: 480 + Math.random() * 180, easing: "ease-out" }).onfinish = () => d.remove();
    }
  }

  // 石が放物線を描いて着弾する(fly-x/fly-y方式: 外側=直進、内側=山なり+回転)
  function launchStone(targetCard, onImpact) {
    const from = centerOf(catapultEl.querySelector("img"));
    const to = centerOf(targetCard);
    const wrap = document.createElement("div");
    wrap.className = "stone-fly spin";
    wrap.style.left = "0px"; wrap.style.top = "0px";
    const img = document.createElement("img");
    img.src = "assets/vfx/catapult_stone.png"; // ユーザー提供の投石アイコン
    wrap.appendChild(img);
    stage.appendChild(wrap);

    const shadow = document.createElement("div");
    shadow.className = "stone-shadow";
    stage.appendChild(shadow);

    const D = 620;
    const startT = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - startT) / D);
      const x = from.x + (to.x - from.x) * p;
      // 山なり: sin弧で高さを付け、着地直前に少し加速する(ease-in寄り)
      const arcHeight = 120;
      const y = from.y + (to.y - from.y) * p - Math.sin(Math.PI * p) * arcHeight;
      wrap.style.transform = `translate(${x - 17}px, ${y - 17}px)`;
      shadow.style.transform = `translate(${x - 15}px, ${to.y - 4}px) scale(${0.5 + p * 0.5})`;
      shadow.style.opacity = 0.15 + p * 0.35;
      if (p < 1) requestAnimationFrame(frame);
      else {
        wrap.remove(); shadow.remove();
        onImpact(to);
      }
    }
    requestAnimationFrame(frame);
  }

  function impactAt(pos, targetCard, dmg, killed) {
    sfx("assets/sfx/barricade_hit.mp3", 0.55);
    setTimeout(() => sfx("assets/sfx/hit_taken_2.mp3", 0.4), 40);
    spawnDust(pos.x, pos.y, killed ? 14 : 8);
    targetCard.animate(
      [{ transform: "translate(0,0)" }, { transform: "translate(-3px,1px)" }, { transform: "translate(3px,-1px)" }, { transform: "translate(0,0)" }],
      { duration: 240, easing: "ease-out" });
    stage.animate(
      [{ transform: "translate(0,0)" }, { transform: "translate(0,2px)" }, { transform: "translate(0,0)" }],
      { duration: 160, easing: "ease-out" });
    const pop = document.createElement("div");
    pop.className = "dmg-pop";
    pop.textContent = "-" + dmg;
    pop.style.left = (pos.x - 12) + "px"; pop.style.top = (pos.y - 28) + "px";
    stage.appendChild(pop);
    pop.animate(
      [{ opacity: 0, transform: "translateY(6px) scale(0.8)" }, { opacity: 1, transform: "translateY(-4px) scale(1.15)", offset: 0.35 }, { opacity: 0, transform: "translateY(-24px) scale(1)" }],
      { duration: 900, easing: "ease-out" }).onfinish = () => pop.remove();
  }

  function fireCatapult() {
    if (busy) return;
    const groundAlive = enemies.filter((e) => e.hp > 0 && !e.isFlying);
    catapultEl.classList.remove("fired"); void catapultEl.offsetWidth; catapultEl.classList.add("fired");
    if (groundAlive.length === 0) {
      addLog("投石器: 地上の目標が見当たらず不発...");
      return;
    }
    busy = true;
    const target = groundAlive[Math.floor(Math.random() * groundAlive.length)];
    const card = enemyRow.querySelector(`[data-id="${target.uid}"]`);
    const ring = card.querySelector(".target-ring");
    ring.animate([{ opacity: 0.9, transform: "scale(1.15)" }, { opacity: 0, transform: "scale(1)" }], { duration: 500, easing: "ease-out" });
    const lv = Math.min(7, Math.max(1, Number(villageLvInput.value) || 1));
    const dmg = rollCatapultDamage(lv, target.def);
    launchStone(card, (pos) => {
      target.hp = Math.max(0, target.hp - dmg);
      const killed = target.hp <= 0;
      impactAt(pos, card, dmg, killed);
      addLog(`投石器が${target.ja}に岩を撃ち込んだ！${dmg}のダメージ！`);
      setTimeout(() => {
        renderEnemies();
        if (killed) addLog(`${target.ja}を撃破した！`);
        busy = false;
      }, 260);
    });
  }

  document.getElementById("btnRoundEnd").addEventListener("click", fireCatapult);
  document.getElementById("btnToggleFly").addEventListener("click", () => {
    const alive = enemies.filter((e) => e.hp > 0);
    if (!alive.length) return;
    const t = alive[Math.floor(Math.random() * alive.length)];
    t.isFlying = !t.isFlying;
    renderEnemies();
    addLog(`${t.ja}が${t.isFlying ? "飛行状態になった(投石の対象外)" : "地上へ降りた(投石の対象内)"}`);
  });
  document.getElementById("btnAllFly").addEventListener("click", () => {
    enemies.forEach((e) => { if (e.hp > 0) e.isFlying = true; });
    renderEnemies();
    addLog("敵が全員飛行ユニットになった(次のラウンド終了で投石は不発になるはず)");
  });
  document.getElementById("btnReset").addEventListener("click", resetScene);

  resetScene();
})();
</script>
</body>
</html>
