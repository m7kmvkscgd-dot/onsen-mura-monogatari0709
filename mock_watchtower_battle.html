<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>見張り台配置モック</title>
<style>
  /* 襲撃戦で「5人目(狩人/砲術士)が見張り台の上にいる」ことを視覚的に見せるモック(ゲーム本体には未実装)。
     機構はユーザー確定どおり他の4人と同じ(敵から普通に狙われる)で、あくまで見た目の話。
     案A: CSSで組んだ木のやぐら(足場+筋交い)の上にカードを持ち上げる
     案B: 見張り台の建物イラスト(assets/icons/buildings/watchtower.png)を土台に使う
     ボタン: 敵の攻撃(高所のカードにもダメージポップ=狙われる仕様の確認)/支援射撃(高所から矢が飛ぶ) */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; background: #14100c; color: #e8e0d0; display: flex; justify-content: center; user-select: none; -webkit-user-select: none; }
  .stage { position: relative; width: 100%; max-width: 480px; height: 100dvh; overflow: hidden; }
  .bg { position: absolute; inset: 0; background: url("assets/bg/departure_gate.jpg") center / cover no-repeat #1a1410; }
  .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(20,24,27,0.2), rgba(20,24,27,0.7) 55%, rgba(20,24,27,0.9)); }

  .enemy-row { position: absolute; top: 0; left: 0; right: 0; z-index: 1; display: flex; justify-content: center; gap: 3px; padding: 38px 0.4rem 10px; }
  .enemy-card {
    position: relative; text-align: center; border-radius: 10px; padding: 0.25rem;
    flex: 1 1 0; min-width: 0; max-width: 78px;
    border: 2px solid transparent;
    background: linear-gradient(155deg, #6b4a2e 0%, #4a3220 55%, #3a2818 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 3px 10px rgba(0,0,0,0.4);
  }
  .enemy-card .ename { font-size: 0.62rem; font-weight: 700; }
  .enemy-card img { width: 100%; max-width: 60px; aspect-ratio: 1/1; object-fit: contain; display: block; margin: 0 auto; }
  .enemy-card .hpbar { height: 5px; margin-top: 3px; background: rgba(0,0,0,0.55); border-radius: 3px; overflow: hidden; }
  .enemy-card .hpbar i { display: block; height: 100%; width: 100%; background: linear-gradient(to bottom, #6cc26c, #3f9e4e); }

  #barricadeWrap { position: absolute; left: 0; right: 0; top: 137px; z-index: 1; pointer-events: none; }
  #barricadeImg { display: block; width: 100%; height: auto; }

  .battle-log {
    position: absolute; left: 8px; right: 8px; top: 240px; height: 84px; z-index: 2;
    border: 2px solid #4b3728; border-radius: 10px;
    outline: 1px solid rgba(217,196,154,0.75); outline-offset: -5px;
    background: rgba(26,20,14,0.9); padding: 10px 12px; font-size: 0.74rem; line-height: 1.5;
  }
  .party-bar { position: absolute; left: 0; right: 0; top: 358px; display: flex; justify-content: center; align-items: flex-start; gap: 8px; z-index: 3; }
  .pcard { position: relative; width: 76px; border-radius: 10px; padding: 4px; text-align: center; background: linear-gradient(160deg, rgba(38,46,52,0.92), rgba(24,30,36,0.92)); border: 1px solid rgba(255,255,255,0.14); }
  .pcard img { width: 52px; display: block; margin: 0 auto; }
  .pcard .bar { height: 4px; border-radius: 2px; overflow: hidden; background: rgba(0,0,0,0.5); margin-top: 2px; }
  .pcard .bar i { display: block; height: 100%; width: 85%; background: #5fae6e; }

  /* ---- 見張り台スロット(5人目) ---- */
  /* スロット自体は列の並びに残し、中のカードだけを上へ持ち上げる。
     持ち上げた分の下の空間に「やぐら」を描く(案A)か、建物イラストを敷く(案B) */
  .tower-slot { position: relative; width: 76px; }
  .tower-slot .pcard { transform: translateY(-48px); z-index: 2; box-shadow: 0 6px 12px rgba(0,0,0,0.55); }
  /* カードの下端に低い手すり(柵)を重ねて「台の上に立っている」感を出す */
  .tower-slot .pcard::after {
    content: ''; position: absolute; left: 4px; right: 4px; bottom: -2px; height: 10px;
    background:
      repeating-linear-gradient(to right, #7a5230 0 5px, transparent 5px 14px),
      linear-gradient(to bottom, transparent 0 3px, #5d3f24 3px 6px, transparent 6px);
    border-radius: 2px; pointer-events: none;
  }
  .tower-slot .tower-tag {
    position: absolute; top: -66px; left: 50%; transform: translateX(-50%);
    z-index: 3; font-size: 0.56rem; font-weight: 900; white-space: nowrap;
    color: #e8dcbf; background: rgba(30,22,14,0.9); border: 1px solid rgba(180,120,90,0.6);
    border-radius: 9px; padding: 1px 7px; text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }

  /* 案A: CSSのやぐら(2本脚+筋交い+梁) */
  .yagura { position: absolute; left: 0; right: 0; top: 30px; height: 56px; z-index: 1; pointer-events: none; }
  .yagura .beam { position: absolute; left: 2px; right: 2px; top: 0; height: 7px; border-radius: 2px;
    background: linear-gradient(to bottom, #8a5f38, #5d3f24); box-shadow: 0 2px 3px rgba(0,0,0,0.5); }
  .yagura .leg { position: absolute; top: 5px; width: 7px; height: 52px; border-radius: 2px;
    background: linear-gradient(to right, #7a5230, #4e3520); box-shadow: 1px 2px 3px rgba(0,0,0,0.5); }
  .yagura .leg.l { left: 8px; transform: rotate(6deg); }
  .yagura .leg.r { right: 8px; transform: rotate(-6deg); }
  .yagura .brace { position: absolute; left: 50%; top: 26px; width: 62px; height: 5px; border-radius: 2px;
    background: linear-gradient(to bottom, #6d4a2b, #46301d); }
  .yagura .brace.b1 { transform: translateX(-50%) rotate(24deg); }
  .yagura .brace.b2 { transform: translateX(-50%) rotate(-24deg); }

  /* 案B: 見張り台の建物イラストを土台に使う */
  .tower-building { position: absolute; left: 50%; transform: translateX(-50%); top: 26px; width: 86px; z-index: 1; pointer-events: none;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.55)); }

  .mode-a .tower-building { display: none; }
  .mode-b .yagura { display: none; }

  /* 演出類 */
  .dmg-pop { position: absolute; z-index: 6; font-weight: 900; font-size: 1.05rem; color: #ff7a66; text-shadow: 0 1px 3px rgba(0,0,0,0.95); pointer-events: none; }
  .arrow { position: absolute; z-index: 6; width: 26px; height: 3px; border-radius: 2px; background: linear-gradient(to right, transparent, #e8dcbf 40%, #fff); pointer-events: none; }
  .muzzle { position: absolute; z-index: 6; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(#fff7d9, rgba(255,180,60,0.9) 45%, transparent 70%); pointer-events: none; }

  .controls { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 10; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .controls button { font-family: inherit; font-size: 0.74rem; font-weight: 700; color: #e8e0d0; background: linear-gradient(160deg, #3a4750, #26313a); border: 1px solid rgba(255,255,255,0.22); border-radius: 9px; padding: 11px 4px; }
  .controls button:active { transform: scale(0.96); }
  .controls button.active { border-color: rgba(240,200,120,0.85); color: #f0e0b0; }
  .mock-note { position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%); z-index: 10; font-size: 0.6rem; color: rgba(232,224,208,0.6); background: rgba(0,0,0,0.4); padding: 2px 10px; border-radius: 10px; white-space: nowrap; }
</style>
</head>
<body>
<div class="stage mode-a" id="stage">
  <div class="bg"></div>
  <div class="enemy-row" id="enemyRow"></div>
  <div id="barricadeWrap"><img id="barricadeImg" src="assets/battle_barricade.png" alt=""></div>
  <div class="battle-log" id="log"><div>弓子は見張り台に登った！</div></div>
  <div class="party-bar" id="partyBar"></div>
  <div class="mock-note">見張り台配置モック(本体には未実装)</div>
  <div class="controls">
    <button id="btnMode">案A: やぐら</button>
    <button id="btnEnemyAtk">敵の攻撃</button>
    <button id="btnShoot">支援射撃</button>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById("stage");
  document.getElementById("enemyRow").innerHTML = Array.from({ length: 5 }, () =>
    '<div class="enemy-card"><div class="ename">猪</div><img src="assets/enemies/inoshishi.png"><div class="hpbar"><i></i></div></div>').join("");
  // 4人の地上部隊+5人目(狩人)は見張り台スロット
  const ground = ["samurai", "spearman", "naginata", "onmyoji"];
  document.getElementById("partyBar").innerHTML =
    ground.map((c) => `<div class="pcard"><img src="assets/class_${c}.png"><div class="bar"><i></i></div></div>`).join("") +
    `<div class="tower-slot">
      <div class="yagura"><div class="beam"></div><div class="leg l"></div><div class="leg r"></div><div class="brace b1"></div><div class="brace b2"></div></div>
      <img class="tower-building" src="assets/icons/buildings/watchtower.png" alt="">
      <div class="pcard" id="towerCard"><img src="assets/class_hunter.png"><div class="bar"><i></i></div></div>
      <div class="tower-tag">🏹 見張り台</div>
    </div>`;

  function addLog(t) {
    const logEl = document.getElementById("log");
    const d = document.createElement("div");
    d.textContent = t;
    logEl.appendChild(d);
    while (logEl.children.length > 3) logEl.removeChild(logEl.firstChild);
  }

  // 案A(やぐら)/案B(建物イラスト)の切り替え
  let mode = "a";
  document.getElementById("btnMode").onclick = () => {
    mode = mode === "a" ? "b" : "a";
    stage.className = "stage mode-" + mode;
    document.getElementById("btnMode").textContent = mode === "a" ? "案A: やぐら" : "案B: 建物イラスト";
  };

  function centerOf(el) {
    const r = el.getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
  }

  // 敵の攻撃: 見張り台の上のカードが被弾する(=他の4人と同じく狙われる仕様、ユーザー確定)
  document.getElementById("btnEnemyAtk").onclick = () => {
    const card = document.getElementById("towerCard");
    card.animate(
      [{ transform: "translateY(-48px)" }, { transform: "translateY(-48px) translateX(-5px)" }, { transform: "translateY(-48px) translateX(5px)" }, { transform: "translateY(-48px)" }],
      { duration: 260, easing: "ease-out" });
    const p = centerOf(card);
    const pop = document.createElement("div");
    pop.className = "dmg-pop";
    pop.textContent = "-14";
    pop.style.left = (p.x - 12) + "px";
    pop.style.top = (p.y - 30) + "px";
    stage.appendChild(pop);
    pop.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-26px)", opacity: 0 }], { duration: 750, easing: "ease-out" }).onfinish = () => pop.remove();
    addLog("猪の突進！ 弓子は14のダメージを受けた");
  };

  // 支援射撃: 高所から敵へ矢が飛ぶ(通常攻撃の見た目が「上から」になるだけ)
  document.getElementById("btnShoot").onclick = () => {
    const card = document.getElementById("towerCard");
    const enemies = [...document.querySelectorAll(".enemy-card")];
    const target = enemies[Math.floor(Math.random() * enemies.length)];
    const from = centerOf(card);
    const to = centerOf(target);
    const mz = document.createElement("div");
    mz.className = "muzzle";
    mz.style.left = (from.x - 8) + "px";
    mz.style.top = (from.y - 30) + "px";
    stage.appendChild(mz);
    mz.animate([{ opacity: 1, transform: "scale(0.6)" }, { opacity: 0, transform: "scale(1.5)" }], { duration: 200 }).onfinish = () => mz.remove();
    const arrow = document.createElement("div");
    arrow.className = "arrow";
    const dx = to.x - from.x, dy = to.y - (from.y - 24);
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    arrow.style.left = from.x + "px";
    arrow.style.top = (from.y - 24) + "px";
    arrow.style.transform = `rotate(${ang}deg)`;
    stage.appendChild(arrow);
    arrow.animate(
      [{ transform: `translate(0,0) rotate(${ang}deg)`, opacity: 1 },
       { transform: `translate(${dx}px,${dy}px) rotate(${ang}deg)`, opacity: 1 }],
      { duration: 240, easing: "linear" }).onfinish = () => {
        arrow.remove();
        target.animate([{ filter: "brightness(2.2)" }, { filter: "brightness(1)" }], { duration: 240 });
        const pop = document.createElement("div");
        pop.className = "dmg-pop";
        pop.style.color = "#ffd97a";
        pop.textContent = "18";
        pop.style.left = (to.x - 10) + "px";
        pop.style.top = (to.y - 14) + "px";
        stage.appendChild(pop);
        pop.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-24px)", opacity: 0 }], { duration: 700, easing: "ease-out" }).onfinish = () => pop.remove();
      };
    addLog("弓子の支援射撃！ 猪に18のダメージ");
  };
})();
</script>
</body>
</html>
