<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温泉村物語 要望・バグ報告</title>
<style>
  :root { --bg:#141414; --card-bg:#1d2126; --card-border:#3a3f46; --gold:#c9a55a; --title:#e8dcbf; --body:#d5cfc2; --caption:#8f9aa5; --danger:#e06c60; --success:#7bc96b; --info:#7db3d5; --radius:10px; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Hiragino Sans","Yu Gothic",sans-serif; background:var(--bg); color:var(--body); padding-bottom:80px; }
  .container { max-width:640px; margin:0 auto; padding:12px; }
  h1 { font-size:1.02rem; color:var(--title); padding:14px 2px 2px; }
  .sub { font-size:0.68rem; color:var(--caption); margin-bottom:12px; line-height:1.6; }
  .form-card { background:var(--card-bg); border:1px solid var(--card-border); border-left:3px solid var(--gold); border-radius:var(--radius); padding:12px; margin-bottom:16px; }
  .cat-row { display:flex; gap:6px; margin-bottom:8px; }
  .cat-row button { flex:1; font-family:inherit; font-size:0.78rem; font-weight:700; color:var(--caption); background:#22262b; border:1px solid var(--card-border); border-radius:8px; padding:9px 0; }
  .cat-row button.on { color:var(--title); border-color:var(--gold); background:#2a2c26; }
  textarea { width:100%; min-height:110px; background:rgba(0,0,0,0.25); border:1px solid var(--card-border); border-radius:8px; color:var(--body); font-size:0.9rem; font-family:inherit; padding:9px; line-height:1.6; }
  .photo-row { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .photo-row label.add { font-size:0.74rem; font-weight:700; color:var(--body); background:#26313a; border:1px solid var(--card-border); border-radius:8px; padding:9px 12px; }
  .photo-row input { display:none; }
  .thumb { position:relative; }
  .thumb img { width:52px; height:52px; object-fit:cover; border-radius:7px; border:1px solid var(--card-border); display:block; }
  .thumb button { position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; border:none; background:var(--danger); color:#fff; font-size:0.7rem; font-weight:900; line-height:1; }
  .send-row { margin-top:10px; display:flex; align-items:center; gap:10px; }
  .send-row button { font-family:inherit; font-size:0.88rem; font-weight:700; color:#1a1a1a; background:var(--gold); border:none; border-radius:9px; padding:11px 22px; }
  .send-row button:disabled { opacity:0.5; }
  #formMsg { font-size:0.72rem; color:var(--success); }
  #formMsg.err { color:var(--danger); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; font-family:inherit; font-size:0.76rem; font-weight:700; color:var(--caption); background:#22262b; border:1px solid var(--card-border); border-radius:20px; padding:7px 0; }
  .tabs button.on { color:var(--title); border-color:var(--gold); }
  .item { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:11px 12px; margin-bottom:9px; }
  .item.st-open { border-left:3px solid var(--danger); }
  .item.st-done { border-left:3px solid var(--success); }
  .item.st-closed { border-left:3px solid var(--card-border); opacity:0.65; }
  .item-head { display:flex; align-items:center; gap:7px; font-size:0.7rem; color:var(--caption); margin-bottom:5px; flex-wrap:wrap; }
  .st { font-size:0.6rem; font-weight:700; border-radius:5px; padding:0 5px; border:1px solid; }
  .st.open { color:var(--danger); border-color:var(--danger); }
  .st.done { color:var(--success); border-color:var(--success); }
  .st.closed { color:var(--caption); border-color:var(--caption); }
  .item-body { font-size:0.85rem; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .note { margin-top:8px; background:rgba(123,201,107,0.08); border:1px dashed var(--success); border-radius:8px; padding:8px 10px; font-size:0.78rem; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .note b { color:var(--success); font-size:0.68rem; display:block; margin-bottom:3px; }
  .item-actions { margin-top:8px; display:flex; gap:8px; }
  .item-actions button { font-family:inherit; font-size:0.7rem; font-weight:700; color:var(--body); background:#26313a; border:1px solid var(--card-border); border-radius:7px; padding:7px 11px; }
  .imgs { margin-top:8px; display:flex; flex-direction:column; gap:8px; }
  .imgs img { max-width:100%; border-radius:8px; border:1px solid var(--card-border); }
  .empty { text-align:center; font-size:0.76rem; color:var(--caption); padding:24px 0; }
  .backlink { display:inline-block; font-size:0.72rem; color:var(--info); text-decoration:none; margin-bottom:4px; }
</style>
</head>
<body>
<div class="container">
  <a class="backlink" href="tools.html">← 開発ツールへ戻る</a>
  <h1>📮 要望・バグ報告</h1>
  <p class="sub">気づいたことをここに放り投げておけば、次のClaude Codeセッションで「要望修正して」と言うだけで拾われます。スクショ添付可(自動で縮小)。対応が終わった項目には対応メモが付いて「対応済み」になります。</p>

  <div class="form-card">
    <div class="cat-row" id="catRow">
      <button data-cat="bug" class="on">🐛 バグ</button>
      <button data-cat="wish">💡 要望</button>
      <button data-cat="other">📝 メモ</button>
    </div>
    <textarea id="bodyInput" placeholder="現象・要望を書く(どの画面で・何をしたら・どうなったか)"></textarea>
    <div class="photo-row" id="photoRow">
      <label class="add">📷 スクショ添付<input type="file" id="fileInput" accept="image/*" multiple></label>
    </div>
    <div class="send-row">
      <button id="sendBtn">送信</button>
      <span id="formMsg"></span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="open" class="on">未対応</button>
    <button data-tab="done">対応済み</button>
    <button data-tab="all">全部</button>
  </div>
  <div id="list"><p class="empty">読み込み中…</p></div>
</div>
<script>
const API = "api/requests";
const CAT_LABEL = { bug: "🐛バグ", wish: "💡要望", other: "📝メモ" };
let category = "bug";
let photos = []; // dataURLの配列(送信前に縮小済み)
let items = [];
let tab = "open";

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtDate(iso) {
  const d = new Date(iso);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
}

// ---- フォーム ----
document.getElementById("catRow").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  category = btn.dataset.cat;
  document.querySelectorAll("#catRow button").forEach((b) => b.classList.toggle("on", b === btn));
});

// 画像はcanvasで最大1400pxのJPEGに縮小してから添付する(KV容量とiPhone回線への配慮)
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1400;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function renderThumbs() {
  document.querySelectorAll("#photoRow .thumb").forEach((el) => el.remove());
  const row = document.getElementById("photoRow");
  photos.forEach((src, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    d.innerHTML = `<img src="${src}"><button data-i="${i}">×</button>`;
    d.querySelector("button").onclick = () => { photos.splice(i, 1); renderThumbs(); };
    row.appendChild(d);
  });
}
document.getElementById("fileInput").addEventListener("change", async (e) => {
  const msg = document.getElementById("formMsg");
  for (const f of Array.from(e.target.files).slice(0, 4 - photos.length)) {
    try { photos.push(await compressImage(f)); } catch (err) { msg.className = "err"; msg.textContent = "画像の読み込みに失敗"; }
  }
  e.target.value = "";
  renderThumbs();
});
document.getElementById("sendBtn").onclick = async () => {
  const body = document.getElementById("bodyInput").value.trim();
  const msg = document.getElementById("formMsg");
  msg.className = ""; msg.textContent = "";
  if (!body) { msg.className = "err"; msg.textContent = "内容を書いてください"; return; }
  const btn = document.getElementById("sendBtn");
  btn.disabled = true; msg.textContent = "送信中…";
  try {
    const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ category, body, images: photos }) });
    if (!res.ok) throw new Error(res.status);
    document.getElementById("bodyInput").value = "";
    photos = []; renderThumbs();
    msg.textContent = "送信しました ✅";
    load();
  } catch (err) {
    msg.className = "err"; msg.textContent = "送信失敗(電波を確認して再試行)";
  }
  btn.disabled = false;
};

// ---- 一覧 ----
document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  tab = btn.dataset.tab;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b === btn));
  renderList();
});
async function load() {
  try {
    const res = await fetch(API);
    items = await res.json();
  } catch (e) {
    document.getElementById("list").innerHTML = '<p class="empty">読み込み失敗(電波を確認して再読み込み)</p>';
    return;
  }
  renderList();
}
function renderList() {
  const list = document.getElementById("list");
  const shown = items.filter((it) => tab === "all" ? true : tab === "open" ? it.status === "open" : it.status === "done");
  if (shown.length === 0) { list.innerHTML = '<p class="empty">ここに表示する項目はありません</p>'; return; }
  list.innerHTML = "";
  shown.forEach((it) => {
    const stLabel = { open: "未対応", done: "対応済み", closed: "確認済み" }[it.status] || it.status;
    const el = document.createElement("div");
    el.className = "item st-" + it.status;
    let html = `<div class="item-head"><span>${CAT_LABEL[it.category] || it.category}</span><span>${fmtDate(it.createdAt)}</span><span class="st ${it.status}">${stLabel}</span></div>` +
      `<div class="item-body">${esc(it.body)}</div>`;
    if (it.note) html += `<div class="note"><b>🤖 対応メモ</b>${esc(it.note)}</div>`;
    html += `<div class="imgs" data-id="${it.id}"></div>`;
    const actions = [];
    if (it.imageCount > 0) actions.push(`<button data-act="imgs" data-id="${it.id}">🖼️ 画像${it.imageCount}枚を表示</button>`);
    if (it.status === "done") actions.push(`<button data-act="close" data-id="${it.id}">確認OK(非表示にする)</button>`);
    if (actions.length) html += `<div class="item-actions">${actions.join("")}</div>`;
    el.innerHTML = html;
    list.appendChild(el);
  });
}
document.getElementById("list").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.act === "imgs") {
    btn.disabled = true; btn.textContent = "読み込み中…";
    try {
      const it = await fetch(API + "/" + id).then((r) => r.json());
      const box = document.querySelector(`.imgs[data-id="${id}"]`);
      box.innerHTML = (it.images || []).map((src) => `<img src="${src}">`).join("");
      btn.remove();
    } catch (err) { btn.disabled = false; btn.textContent = "画像の読み込み失敗(再試行)"; }
  } else if (btn.dataset.act === "close") {
    btn.disabled = true;
    try {
      await fetch(API + "/" + id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "closed" }) });
      load();
    } catch (err) { btn.disabled = false; }
  }
});
load();
</script>
</body>
</html>
