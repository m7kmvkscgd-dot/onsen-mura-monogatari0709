<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>雷SEの試聴(10本から選ぶ)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #14181b; color: #ece8dc; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; padding: 0.9rem; }
  h1 { font-size: 1.05rem; margin: 0.2rem 0 0.2rem; }
  p.note { font-size: 12px; color: #9aa79f; margin: 0 0 0.8rem; line-height: 1.5; }
  .row { display: flex; align-items: center; gap: 0.6rem; width: 100%; margin-bottom: 0.4rem;
    background: #232830; border: 1px solid #4a505a; border-radius: 10px; padding: 0.6rem 0.7rem; }
  .row button { flex: 0 0 auto; width: 58px; height: 44px; border-radius: 9px; border: 1px solid #6d5a35;
    background: #3a3020; color: #f0e2b8; font-size: 1.1rem; font-weight: 800; }
  .row button:active { background: #4a3e28; }
  .row .info { flex: 1; min-width: 0; }
  .row .nm { font-size: 0.9rem; font-weight: 800; }
  .row .src { font-size: 10.5px; color: #9aa79f; line-height: 1.4; }
  .row.playing { border-color: #d7b66f; }
</style>
</head>
<body>
<h1>⚡ 雷SEの試聴(10本)</h1>
<p class="note">▶で再生(もう一度押すと止まる)。気に入った番号を教えてください。音量は全て同じに揃えてあります。</p>
<div id="list"></div>
<script>
const CLIPS = [
  { n: 1,  label: "雷1: 王道の雷鳴(クラップ→残響)", src: "OpenGameArt「Thunder」Jerimee / CC-BY 3.0" },
  { n: 2,  label: "雷2: 遠雷の轟き(野外録音)", src: "OpenGameArt Gregor Quendel / CC-BY 4.0" },
  { n: 3,  label: "雷3: 連続雷の一撃A", src: "OpenGameArt「Thunder」Jerimee / CC-BY 3.0" },
  { n: 4,  label: "雷4: 連続雷の一撃B", src: "OpenGameArt「Thunder」Jerimee / CC-BY 3.0" },
  { n: 5,  label: "雷5: ごく近くの落雷(雨音入り)", src: "OpenGameArt InspectorJ / CC-BY 3.0" },
  { n: 6,  label: "雷6: 雨中の長い雷鳴", src: "OpenGameArt WuxiaScrub / CC0" },
  { n: 7,  label: "雷7: 野外録音の強い一撃A", src: "OpenGameArt Gregor Quendel / CC-BY 4.0" },
  { n: 8,  label: "雷8: 野外録音の強い一撃B", src: "OpenGameArt Gregor Quendel / CC-BY 4.0" },
  { n: 9,  label: "雷9: 映画用の重い雷(Nosferatu)", src: "Wikimedia Commons Richard Humphries / CC-BY 4.0" },
  { n: 10, label: "雷10: 生録りの雷(長め)", src: "Wikimedia Commons / CC-BY-SA 4.0" },
];
const list = document.getElementById("list");
let current = null, currentRow = null;
CLIPS.forEach((c) => {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<button>▶</button><div class="info"><div class="nm">${c.label}</div><div class="src">${c.src}</div></div>`;
  const audio = new Audio(`assets/sfx/thunder_pick/thunder_${String(c.n).padStart(2, "0")}.mp3`);
  row.querySelector("button").onclick = () => {
    if (current && current !== audio) { current.pause(); currentRow.classList.remove("playing"); }
    if (!audio.paused) { audio.pause(); row.classList.remove("playing"); current = null; return; }
    audio.currentTime = 0;
    audio.play().catch(() => {});
    row.classList.add("playing");
    audio.onended = () => row.classList.remove("playing");
    current = audio; currentRow = row;
  };
  list.appendChild(row);
});
</script>
</body>
</html>
