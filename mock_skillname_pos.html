<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>モック: 技名の縦書き短冊(案I)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #14181b; color: #ece8dc; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  button { touch-action: manipulation; font-family: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; }

  /* シーンは上部に固定(sticky)。下の調整卓をスクロールしても短冊が見え続ける */
  .scene {
    position: sticky; top: 0; z-index: 10;
    height: 400px; overflow: hidden;
    background-image: url('assets/bg/suzunari_gake.jpg');
    background-size: cover; background-position: center 30%;
    box-shadow: 0 6px 14px rgba(0,0,0,0.6);
  }
  .scene::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(20,24,27,0.15), rgba(20,24,27,0.55) 60%, rgba(20,24,27,0.8)); }
  .logbox { position: absolute; top: 34px; left: 12px; right: 12px; z-index: 2;
    border: 2px solid #8a7448; border-radius: 10px; background: rgba(16,13,10,0.82);
    min-height: 44px; padding: 6px 10px; font-size: 0.72rem; color: #d9cfb8; }
  .flee-btn { position: absolute; top: 3px; right: 12px; z-index: 3;
    font-size: 0.74rem; font-weight: 700; padding: 5px 11px; border-radius: 999px;
    border: 1px solid rgba(217,207,184,0.55); background: rgba(24,20,16,0.82); color: #d9cfb8; }
  .enemy { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); z-index: 2; text-align: center; }
  .enemy img { width: 108px; display: block; margin: 0 auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.45)); }
  .enemy .nm { font-size: 0.76rem; font-weight: 700; text-shadow: 0 1px 3px #000; }
  .enemy .hpbar { width: 170px; height: 11px; border-radius: 99px; background: #3a3a3a; margin: 5px auto 0;
    border: 1px solid rgba(0,0,0,0.75); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6); }
  .enemy .hpbar i { display: block; height: 100%; width: 62%; background: #4caf6f; }
  .allies { position: absolute; left: 0; right: 0; bottom: 10px; z-index: 2; display: flex; justify-content: center; gap: 10px; }
  .ally { position: relative; width: 88px; background: rgba(30,34,40,0.85); border: 1px solid #3a4048; border-radius: 10px; padding: 5px; text-align: center; }
  .ally img { width: 64px; height: 64px; object-fit: contain; background: #353a44; border-radius: 6px; }
  .ally .nm { font-size: 0.68rem; font-weight: 700; }
  .ally .hp { height: 6px; border-radius: 99px; background: #3a3a3a; margin-top: 3px; overflow: hidden; }
  .ally .hp i { display: block; height: 100%; width: 80%; background: #4caf6f; }
  .fx-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .fx-item { position: absolute; opacity: 0; }

  /* 縦書き短冊: 味方必殺技=金赤、敵大技=紫 */
  .tanzaku {
    writing-mode: vertical-rl; white-space: nowrap; display: inline-block;
    padding: 20px 7px; font-weight: 900; font-size: 1.02rem; letter-spacing: 0.18em;
    color: #fff7e6; text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    background: linear-gradient(180deg, transparent, rgba(120,20,16,0.92) 12%, rgba(60,8,6,0.95) 50%, rgba(120,20,16,0.92) 88%, transparent);
    border-left: 1px solid rgba(255,214,110,0.8); border-right: 1px solid rgba(255,214,110,0.8);
  }
  .tanzaku.enemy-big {
    color: #f3eaff;
    background: linear-gradient(180deg, transparent, rgba(74,26,110,0.92) 12%, rgba(36,10,58,0.95) 50%, rgba(74,26,110,0.92) 88%, transparent);
    border-left: 1px solid rgba(200,150,255,0.8); border-right: 1px solid rgba(200,150,255,0.8);
  }

  .panel { padding: 0.7rem 0.9rem 3rem; }
  .btns { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  .btns button { flex: 1; padding: 0.6rem 0; border-radius: 9px; border: 1px solid #4a505a; background: #2e3540; color: #ece8dc; font-size: 0.85rem; font-weight: 700; }
  .btns button:active { background: #3a4250; }
  .tuner { border: 1px solid #4a505a; border-radius: 9px; padding: 0.55rem 0.6rem; }
  .tuner .head { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.4rem; }
  .tuner .head button { border-radius: 8px; border: 1px solid #4a505a; background: #2e3540; color: #ece8dc; font-size: 0.75rem; font-weight: 700; padding: 0.35rem 0.7rem; }
  .tuner label { font-size: 0.72rem; color: #9aa79f; display: block; margin-top: 0.3rem; }
  .tuner input[type=range] { width: 100%; }
  .tuner p { font-size: 0.7rem; color: #9aa79f; margin: 0.4rem 0 0; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="scene" id="scene">
    <div class="logbox" id="logbox">白縫が銀の鈴を鳴らした。赤い組紐が、静かに獲物を探し始める…！</div>
    <button class="flee-btn">🏃逃げる</button>
    <div class="enemy">
      <img src="assets/enemies/amayome_shiranui.png">
      <div class="nm">雨嫁・白縫</div>
      <div class="hpbar" id="enemyHp"><i></i></div>
    </div>
    <div class="allies" id="allies">
      <div class="ally"><img src="assets/class_samurai.png"><div class="nm">権兵衛</div><div class="hp"><i></i></div></div>
      <div class="ally"><img src="assets/class_hunter.png"><div class="nm">小夜</div><div class="hp"><i></i></div></div>
      <div class="ally"><img src="assets/class_onmyoji.png"><div class="nm">弥助</div><div class="hp"><i></i></div></div>
    </div>
    <div class="fx-layer" id="fx"></div>
  </div>

  <div class="panel">
    <div class="btns">
      <button onclick="caseI(0)">左</button>
      <button onclick="caseI(1)">中</button>
      <button onclick="caseI(2)">右</button>
      <button onclick="caseIEnemy()">敵大技</button>
    </div>
    <div class="tuner">
      <div class="head">
        <strong style="font-size:0.8rem;">調整卓</strong>
        <button id="sizeBtn" onclick="toggleSize()">サイズ: 大</button>
        <button id="pinBtn" onclick="togglePin()">調整モード: OFF</button>
      </div>
      <label>横位置(カード右端からのずれ): <span id="dxVal">-14</span>px
        <input type="range" id="dx" min="-60" max="30" value="-14" oninput="tunerChanged()"></label>
      <label>縦位置(アイコン上端への食い込み): <span id="dyVal">18</span>px
        <input type="range" id="dy" min="-30" max="70" value="18" oninput="tunerChanged()"></label>
      <p>調整モードONで中キャラに出しっぱなし→スライダーで動かす→決まった「サイズ+横+縦」の値を教えてください。シーンは上に固定されているのでスクロールしても見えます。</p>
    </div>
  </div>
</div>

<script>
const SKILLS = ["燕返しの太刀", "鬼神化", "祓串の舞", "怒声"];
let skillIdx = 0;
const nextSkill = () => SKILLS[skillIdx++ % SKILLS.length];
const sceneEl = () => document.getElementById("scene").getBoundingClientRect();
const allyRect = (i) => document.querySelectorAll(".ally")[i].getBoundingClientRect();
function glow(i) {
  document.querySelectorAll(".ally")[i].animate(
    [{ boxShadow: "0 0 0 rgba(255,214,110,0)" }, { boxShadow: "0 0 20px rgba(255,214,110,0.9)", offset: 0.4 }, { boxShadow: "0 0 0 rgba(255,214,110,0)" }], { duration: 700 });
}
let tanzakuSmall = false;
let pinned = null;
const tunerDx = () => Number(document.getElementById("dx").value);
const tunerDy = () => Number(document.getElementById("dy").value);
function tanzakuHtml(text, enemy) {
  const sizeCss = tanzakuSmall ? "font-size:0.82rem;padding:14px 5px;letter-spacing:0.14em;" : "";
  return `<span class="tanzaku${enemy ? " enemy-big" : ""}" style="${sizeCss}">${text}</span>`;
}
function placeTanzaku(el, anchorRect, riseFrom) {
  const s = sceneEl();
  const h = el.firstChild.getBoundingClientRect().height || 130;
  el.style.left = `${anchorRect.right - s.left + tunerDx()}px`;
  el.style.top = `${riseFrom - s.top - h + tunerDy()}px`;
}
function spawnTanzaku(html, anchorRect, riseFrom) {
  const el = document.createElement("div");
  el.className = "fx-item";
  el.innerHTML = html;
  document.getElementById("fx").appendChild(el);
  placeTanzaku(el, anchorRect, riseFrom);
  el.animate([
    { opacity: 0, transform: "translateY(14px)" },
    { opacity: 1, transform: "translateY(0)", offset: 0.18 },
    { opacity: 1, transform: "translateY(0)", offset: 0.8 },
    { opacity: 0, transform: "translateY(-10px)" },
  ], { duration: 1000, easing: "ease" }).onfinish = () => el.remove();
}
function caseI(i) {
  glow(i);
  const r = allyRect(i);
  spawnTanzaku(tanzakuHtml(nextSkill(), false), r, r.top);
}
function caseIEnemy() {
  const img = document.querySelector(".enemy img").getBoundingClientRect();
  spawnTanzaku(tanzakuHtml("嫁入りの鈴", true), img, img.top + 30);
}
function toggleSize() {
  tanzakuSmall = !tanzakuSmall;
  document.getElementById("sizeBtn").textContent = tanzakuSmall ? "サイズ: 小" : "サイズ: 大";
  if (pinned) refreshPinned();
}
function togglePin() {
  if (pinned) { pinned.remove(); pinned = null; }
  else {
    pinned = document.createElement("div");
    pinned.className = "fx-item";
    pinned.style.opacity = "1";
    document.getElementById("fx").appendChild(pinned);
    refreshPinned();
  }
  document.getElementById("pinBtn").textContent = pinned ? "調整モード: ON" : "調整モード: OFF";
}
function refreshPinned() {
  if (!pinned) return;
  pinned.innerHTML = tanzakuHtml("燕返しの太刀", false);
  placeTanzaku(pinned, allyRect(1), allyRect(1).top);
}
function tunerChanged() {
  document.getElementById("dxVal").textContent = tunerDx();
  document.getElementById("dyVal").textContent = tunerDy();
  if (pinned) refreshPinned();
}
</script>
</body>
</html>
