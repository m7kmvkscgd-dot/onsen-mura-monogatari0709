<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>モック: 技名表示・改(HPバー重なり対策)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #14181b; color: #ece8dc; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  button { touch-action: manipulation; font-family: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; }

  /* ---- 戦闘シーンの簡易再現(敵HPバーが味方カードのすぐ上=実際の衝突状況を再現) ---- */
  .scene {
    position: relative; height: 470px; overflow: hidden;
    background-image: url('assets/bg/suzunari_gake.jpg');
    background-size: cover; background-position: center 30%;
  }
  .scene::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(20,24,27,0.15), rgba(20,24,27,0.55) 60%, rgba(20,24,27,0.8)); }
  .enemy { position: absolute; top: 36px; left: 50%; transform: translateX(-50%); z-index: 2; text-align: center; }
  .enemy img { width: 128px; display: block; margin: 0 auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.45)); }
  .enemy .nm { font-size: 0.8rem; font-weight: 700; text-shadow: 0 1px 3px #000; }
  .enemy .hpbar { width: 180px; height: 12px; border-radius: 99px; background: #3a3a3a; margin: 6px auto 0;
    border: 1px solid rgba(0,0,0,0.75); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.6); }
  .enemy .hpbar i { display: block; height: 100%; width: 62%; background: #4caf6f; }
  .allies { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 2; display: flex; justify-content: center; gap: 10px; }
  .ally { position: relative; width: 92px; background: rgba(30,34,40,0.85); border: 1px solid #3a4048; border-radius: 10px; padding: 5px; text-align: center; }
  .ally img { width: 68px; height: 68px; object-fit: contain; background: #353a44; border-radius: 6px; }
  .ally .nm { font-size: 0.7rem; font-weight: 700; }
  .ally .hp { height: 6px; border-radius: 99px; background: #3a3a3a; margin-top: 3px; overflow: hidden; }
  .ally .hp i { display: block; height: 100%; width: 80%; background: #4caf6f; }

  .band {
    display: inline-block; padding: 4px 18px; font-weight: 900; font-size: 0.92rem; letter-spacing: 0.12em;
    color: #fff7e6; white-space: nowrap;
    background: linear-gradient(90deg, transparent, rgba(120,20,16,0.92) 18%, rgba(60,8,6,0.95) 50%, rgba(120,20,16,0.92) 82%, transparent);
    border-top: 1px solid rgba(255,214,110,0.8); border-bottom: 1px solid rgba(255,214,110,0.8);
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
  }
  /* 案F: 帯なしの縁取り文字 */
  .plain-name {
    display: inline-block; font-weight: 900; font-size: 1.02rem; letter-spacing: 0.14em; white-space: nowrap;
    color: #fff3d6;
    text-shadow: 0 0 6px rgba(255,190,80,0.9), 0 2px 3px rgba(0,0,0,1), 0 0 2px #000, 2px 0 2px #000, -2px 0 2px #000, 0 -2px 2px #000;
  }
  .fx-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .fx-item { position: absolute; opacity: 0; }

  .panel { padding: 0.8rem 0.9rem 3rem; }
  .panel h2 { font-size: 0.95rem; margin: 0.9rem 0 0.3rem; }
  .row { display: flex; gap: 0.4rem; margin-bottom: 0.55rem; align-items: stretch; }
  .row .label { flex: 1.6; font-size: 0.78rem; font-weight: 700; padding: 0.45rem 0.5rem; background: #232830; border: 1px solid #4a505a; border-radius: 9px; }
  .row .label small { display: block; font-weight: 400; font-size: 10.5px; color: #9aa79f; line-height: 1.4; margin-top: 2px; }
  .row button { flex: 0.5; border-radius: 9px; border: 1px solid #4a505a; background: #2e3540; color: #ece8dc; font-size: 0.8rem; font-weight: 700; }
  .row button:active { background: #3a4250; }
</style>
</head>
<body>
<div class="wrap">
  <div class="scene" id="scene">
    <div class="enemy">
      <img src="assets/enemies/amayome_shiranui.png">
      <div class="nm">雨嫁・白縫</div>
      <div class="hpbar" id="enemyHp"><i></i></div>
    </div>
    <div class="allies" id="allies">
      <div class="ally"><img src="assets/class_samurai.png"><div class="nm">権兵衛</div><div class="hp"><i></i></div></div>
      <div class="ally"><img src="assets/class_hunter.png"><div class="nm">小夜</div><div class="hp"><i></i></div></div>
      <div class="ally"><img src="assets/class_onmyoji.png"><div class="nm">弥助</div><div class="hp"><i></i></div></div>
    </div>
    <div class="fx-layer" id="fx"></div>
  </div>

  <div class="panel">
    <h2>技名表示・改良案(左/中/右ボタンでその位置のキャラが発動)</h2>

    <div class="row"><div class="label">案E: 自分のカードに重ねる<small>頭上ではなくカードの上端に帯を貼る。敵UIには絶対に触れない。隣のカードに少しかかる</small></div>
      <button onclick="caseE(0)">左</button><button onclick="caseE(1)">中</button><button onclick="caseE(2)">右</button></div>

    <div class="row"><div class="label">案F: 帯をやめて文字だけ<small>頭上のまま、背景帯なしの金縁文字。HPバーに重なっても後ろが透ける</small></div>
      <button onclick="caseF(0)">左</button><button onclick="caseF(1)">中</button><button onclick="caseF(2)">右</button></div>

    <div class="row"><div class="label">案G: 頭上+重なる時だけ自動でカードへ退避<small>基本は今の頭上。敵HPバーと重なる中央キャラの時だけ案Eの位置へ自動で下がる</small></div>
      <button onclick="caseG(0)">左</button><button onclick="caseG(1)">中</button><button onclick="caseG(2)">右</button></div>

    <div class="row"><div class="label">案H: カード下の名前行に重ねる<small>帯をカード幅に絞り、本人の名前の上でフラッシュ。画面上部が完全に空く</small></div>
      <button onclick="caseH(0)">左</button><button onclick="caseH(1)">中</button><button onclick="caseH(2)">右</button></div>
  </div>
</div>

<script>
const SKILLS = ["燕返しの太刀", "鬼神化", "祓串の舞", "怒声"];
let skillIdx = 0;
const nextSkill = () => SKILLS[skillIdx++ % SKILLS.length];
const sceneEl = () => document.getElementById("scene").getBoundingClientRect();
const allyRect = (i) => document.querySelectorAll(".ally")[i].getBoundingClientRect();
function glow(i) {
  document.querySelectorAll(".ally")[i].animate(
    [{ boxShadow: "0 0 0 rgba(255,214,110,0)" }, { boxShadow: "0 0 20px rgba(255,214,110,0.9)", offset: 0.4 }, { boxShadow: "0 0 0 rgba(255,214,110,0)" }], { duration: 700 });
}
function spawn(html, x, y, maxW) {
  const el = document.createElement("div");
  el.className = "fx-item";
  el.innerHTML = html;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  if (maxW) { el.style.maxWidth = `${maxW}px`; el.style.overflow = "hidden"; }
  document.getElementById("fx").appendChild(el);
  el.animate([
    { opacity: 0, transform: "translateX(calc(-50% - 40px))" },
    { opacity: 1, transform: "translateX(-50%)", offset: 0.18 },
    { opacity: 1, transform: "translateX(-50%)", offset: 0.78 },
    { opacity: 0, transform: "translateX(calc(-50% + 30px))" },
  ], { duration: 900, easing: "ease" }).onfinish = () => el.remove();
}
// 案E: 自分のカード上端に重ねる
function caseE(i) {
  glow(i);
  const s = sceneEl(), r = allyRect(i);
  spawn(`<span class="band">${nextSkill()}</span>`, r.left - s.left + r.width / 2, r.top - s.top - 12);
}
// 案F: 頭上のまま帯なし文字だけ
function caseF(i) {
  glow(i);
  const s = sceneEl(), r = allyRect(i);
  spawn(`<span class="plain-name">${nextSkill()}</span>`, r.left - s.left + r.width / 2, r.top - s.top - 36);
}
// 案G: 頭上が敵HPバーと重なる時だけ案Eの位置へ退避(実装ではUI要素と実測で衝突判定する)
function caseG(i) {
  glow(i);
  const s = sceneEl(), r = allyRect(i);
  const hp = document.getElementById("enemyHp").getBoundingClientRect();
  const bandTop = r.top - 36, bandBottom = bandTop + 30;
  const bandHalf = 78; // 帯の概算半幅
  const cx = r.left + r.width / 2;
  const overlaps = bandBottom > hp.top && bandTop < hp.bottom && cx + bandHalf > hp.left && cx - bandHalf < hp.right;
  spawn(`<span class="band">${nextSkill()}</span>`, cx - s.left, overlaps ? r.top - s.top - 12 : r.top - s.top - 36);
}
// 案H: カード幅に絞って名前行の上でフラッシュ
function caseH(i) {
  glow(i);
  const s = sceneEl(), r = allyRect(i);
  spawn(`<span class="band" style="font-size:0.78rem;padding:3px 8px;">${nextSkill()}</span>`,
    r.left - s.left + r.width / 2, r.bottom - s.top - 26, r.width + 8);
}
</script>
</body>
</html>
